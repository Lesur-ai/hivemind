# =============================================================================
# Legal and Contractual Ontology
# =============================================================================
# Specialized for extracting information from contracts, amendments, NDAs,
# terms and conditions, service agreements, and similar documents.

name: legal
version: "1.0"
description: |
  Specialized ontology for legal and contractual documents.
  Optimized to extract clauses, stakeholders, commitments, amounts,
  durations, and contractual obligations.

# LLM-specific instructions
context: |
  You are a legal expert specializing in the analysis of contracts and legal documents.

  ⚠️ CRITICAL EXTRACTION RULES:

  1. YOU MUST use the entity types defined below (do not use "Other"!).
  2. For every CERTIFICATION mentioned (SecNumCloud, HDS, ISO, SOC, etc.) → type = "Certification".
  3. For every DURATION (36 months, 6 months, 30 days, etc.) → type = "Duration".
  4. For every AMOUNT (EUR, euros, price, TOTAL) → type = "Amount".
  5. For every SLA/AVAILABILITY value (99.95%, GTI, GTR, etc.) → type = "SLA".
  6. For every PERSON with a role → type = "LegalRepresentative".
  7. For every COMPANY/ORGANIZATION → type = "Organization".
  8. For every contractual CLAUSE → type = "Clause".

  ⚠️ AMOUNTS — STRICT RULES:
  1. Extract EVERY stated amount together with its context.
  2. When you see "Total", "estimated", or "summary" → IT IS A PRIORITY ENTITY!
  3. Required total format: "X EUR excl. VAT (monthly total/annual total/estimated total)".
  4. EXAMPLE: "Estimated monthly total: EUR 3,150 excl. VAT" → YOU MUST create: "EUR 3,150 excl. VAT (estimated monthly total)".
  5. DO NOT calculate totals yourself — extract the EXACT amount from the document.
  6. The words "Total", "Subtotal", "Estimated", and "Overall" always signal an important amount.

  ⚠️ CERTIFICATIONS — RELATION RULES:
  1. When a sentence says "The provider guarantees/holds/owns [certification]".
  2. → CREATE a GUARANTEES relation between the organization and the certification.
  3. EXAMPLE: "Cloud Temple guarantees SecNumCloud, HDS, ISO 27001"
     → Relations: Cloud Temple SAS → GUARANTEES → SecNumCloud
                  Cloud Temple SAS → GUARANTEES → HDS
                  Cloud Temple SAS → GUARANTEES → ISO 27001
  4. The word "guarantees" always signals a GUARANTEES relation!

  ⚠️ NEVER use the "Other" type except as an absolute last resort!

  The entity name must be EXPLICIT and contain the VALUE:
  - ✅ Good: "SecNumCloud (ANSSI certification)"
  - ❌ Bad: "Provider certification"
  - ✅ Good: "36 months (initial term)"
  - ❌ Bad: "Contract duration"
  - ✅ Good: "99.95% monthly availability"
  - ❌ Bad: "Availability SLA"

# =============================================================================
# Legal-domain entity types
# =============================================================================
entity_types:
  # Stakeholders
  - name: Party
    description: Party to the contract (customer, provider, supplier)
    examples:
      - "The Customer"
      - "The Provider"
      - "Cloud Temple SAS (hereinafter the 'Supplier')"
      - "TechCorp SARL (hereinafter the 'Customer')"

  - name: LegalRepresentative
    description: Authorized legal representative or signatory
    examples:
      - "Jean Dupont, Chief Executive Officer"
      - "Sophie Martin, duly authorized"
      - "Chair of the Board of Directors"

  - name: Organization
    description: Legal entity, company, or institution
    examples:
      - "Cloud Temple SAS"
      - "ANSSI"
      - "French Data Protection Authority (CNIL)"

  # Contractual elements
  - name: Clause
    description: Contract clause or article
    examples:
      - "Confidentiality clause"
      - "Article 12 — Reversibility"
      - "Termination conditions"
      - "Non-solicitation clause"

  - name: Obligation
    description: Obligation or commitment of a party
    examples:
      - "Best-efforts obligation"
      - "Confidentiality commitment"
      - "Availability guarantee"
      - "Duty to advise"

  - name: ContractType
    description: Contract or document type
    examples:
      - "Master Agreement"
      - "Amendment No. 3"
      - "NDA"
      - "Service Agreement"
      - "Terms and Conditions of Sale"

  # Values and metrics
  - name: Amount
    description: Financial amount, price, or total
    priority: high
    examples:
      - "EUR 50,000 excl. VAT"
      - "EUR 2,500 excl. VAT/month"
      - "Fixed price: EUR 150,000"
      - "Estimated monthly total: EUR 3,150 excl. VAT"
      - "Penalty: 10% of the monthly amount"

  - name: Duration
    description: Contract duration, deadline, or notice period
    priority: high
    examples:
      - "Initial term: 36 months"
      - "Termination notice: 3 months"
      - "Renewal period: 12 months"
      - "Payment term: 30 days"

  - name: Date
    description: Effective date, expiry date, or signature date
    priority: high
    examples:
      - "Effective date: 1 January 2026"
      - "Signed on 15 December 2025"
      - "Expiry date: 31 December 2028"

  - name: SLA
    description: Service-level commitment
    priority: high
    examples:
      - "Availability: 99.95%"
      - "GTI: 15 minutes"
      - "GTR: 4 hours"
      - "Response time: 1 business hour"

  # Certifications and compliance
  - name: Certification
    description: Certification, qualification, or standard
    priority: high
    examples:
      - "SecNumCloud"
      - "HDS (Healthcare Data Host)"
      - "ISO 27001:2022"
      - "SOC 2 Type II"

  - name: Regulation
    description: Regulation or applicable law
    examples:
      - "GDPR"
      - "DORA"
      - "NIS2"
      - "French Data Protection Act"
      - "Public Procurement Code"

  # Documents and references
  - name: Annex
    description: Annex or attachment to the contract
    examples:
      - "Annex 1 — Service Agreement"
      - "Annex 3 — Financial Terms"
      - "Annex 5 — Reversibility Plan"

  - name: Service
    description: Service or deliverable provided
    examples:
      - "SecNumCloud hosting"
      - "Managed services"
      - "24/7 support"
      - "Cloud computing services"

  - name: Product
    description: Product, software, or technology referenced in the contract
    examples:
      - "VMware vSphere"
      - "Microsoft 365"
      - "OpenShift"
      - "SaaS solution"

  - name: Reference
    description: Reference to an external document
    examples:
      - "SecNumCloud certificate No. 2025-001"
      - "Commercial offer dated 10/01/2026"
      - "Acceptance report dated 15/12/2025"

  # People
  - name: Person
    description: Named natural person
    examples:
      - "Jean Dupont"
      - "Marie Martin"
      - "Cloud Temple DPO"

  # Locations
  - name: Jurisdiction
    description: Jurisdiction or competent court
    examples:
      - "Paris Commercial Court"
      - "French jurisdiction"
      - "Applicable French law"

  - name: Location
    description: Place of performance or registered office
    examples:
      - "215 avenue Georges Clemenceau, 92000 Nanterre"
      - "Metropolitan France"
      - "Paris data center"

# =============================================================================
# Legal-domain relation types
# =============================================================================
relation_types:
  - name: PARTY_TO
    description: Is a party to the contract
    examples:
      - "Cloud Temple SAS → PARTY_TO → Master Agreement"
      - "TechCorp → PARTY_TO → Service Agreement"

  - name: SIGNED_BY
    description: Document signed by a person
    examples:
      - "Contract → SIGNED_BY → Jean Dupont"

  - name: REPRESENTS
    description: Represents an organization
    examples:
      - "Jean Dupont → REPRESENTS → Cloud Temple SAS"

  - name: INCLUDES_ANNEX
    description: Contract includes an annex
    examples:
      - "Master Agreement → INCLUDES_ANNEX → Annex 1"

  - name: AMENDS
    description: Amendment modifies a contract
    examples:
      - "Amendment No. 3 → AMENDS → Master Agreement"

  - name: SUPERSEDES
    description: Replaces a prior document
    examples:
      - "Terms and Conditions v2 → SUPERSEDES → Terms and Conditions v1"

  - name: HAS_DURATION
    description: Associates a duration with an element
    examples:
      - "Contract → HAS_DURATION → 36 months"

  - name: HAS_AMOUNT
    description: Associates an amount with an element
    examples:
      - "Service → HAS_AMOUNT → EUR 50,000"

  - name: HAS_SLA
    description: Defines a service level
    examples:
      - "IaaS service → HAS_SLA → 99.95% availability"

  - name: REQUIRES_CERTIFICATION
    description: Requires a certification
    examples:
      - "HDS hosting → REQUIRES_CERTIFICATION → HDS"

  - name: GUARANTEES
    description: A party guarantees or holds a certification or service level
    priority: high
    examples:
      - "Cloud Temple SAS → GUARANTEES → SecNumCloud"
      - "Provider → GUARANTEES → HDS"
      - "Cloud Temple → GUARANTEES → ISO 27001"
      - "Provider → GUARANTEES → 99.95% availability"

  - name: HAS_CERTIFICATION
    description: Holds or owns a certification
    priority: high
    examples:
      - "Cloud Temple SAS → HAS_CERTIFICATION → SecNumCloud"
      - "Provider → HAS_CERTIFICATION → HDS"
      - "Cloud Temple → HAS_CERTIFICATION → SOC 2 Type II"

  - name: GOVERNED_BY
    description: Governed by a regulation
    examples:
      - "Data processing → GOVERNED_BY → GDPR"

  - name: DEFINES
    description: Defines or clarifies a term
    examples:
      - "Article 1 → DEFINES → Services"

  - name: OBLIGATES
    description: Creates an obligation for a party
    examples:
      - "Confidentiality clause → OBLIGATES → Customer"

  - name: LOCATED_AT
    description: Place of performance or registered office
    examples:
      - "Cloud Temple → LOCATED_AT → Nanterre"

  - name: EFFECTIVE_DATE
    description: Effective date
    examples:
      - "Contract → EFFECTIVE_DATE → 01/01/2026"

  - name: REFERENCES
    description: Refers to another article, document, or standard
    examples:
      - "Article 12 → REFERENCES → Article 5"
      - "Contract → REFERENCES → GDPR"

  - name: JURISDICTION
    description: Applicable jurisdiction
    examples:
      - "Contract → JURISDICTION → Paris Commercial Court"

  - name: RELATED_TO
    description: Generic relation (last resort if no specific type applies)
    examples:
      - "Concept A → RELATED_TO → Concept B"

  - name: CONTAINS
    description: Contains or includes an element (more generic than INCLUDES_ANNEX)
    examples:
      - "Service Agreement → CONTAINS → Confidentiality clause"
      - "Article 5 → CONTAINS → Best-efforts obligation"

  - name: MENTIONS
    description: Document or clause mentions an entity
    examples:
      - "Article 21 → MENTIONS → GDPR"
      - "Preamble → MENTIONS → Cloud Temple SAS"

  - name: CREATED_BY
    description: Document drafted or created by
    examples:
      - "Terms and Conditions → CREATED_BY → Legal Department"

# =============================================================================
# Specific extraction rules
# =============================================================================
extraction_rules:
  max_entities: 60
  max_relations: 80
  include_metrics: true
  include_durations: true
  include_amounts: true
  extract_implicit_relations: true

  # Priority legal-domain entities
  priority_entities:
    - Party
    - LegalRepresentative
    - Amount
    - Duration
    - SLA
    - Certification
    - Clause

  # Additional instructions
  special_instructions: |
    ⚠️ ARTICLES AND CLAUSES — COMPLETE COVERAGE REQUIRED:
    - Extract EVERY article in the document (Article 1, Article 2, ..., Article 23, etc.) as a Clause entity.
    - Do not omit ANY article, even short or narrowly scoped articles.
    - Also extract sub-articles (for example, Article 23.2).
    - Each article must have an explicit name that includes its number AND title.
    - Example: "Article 23.2 — Reversibility Plan"

    Other rules:
    - ALWAYS extract amounts with their currency and period (excl. VAT/incl. VAT, /month, /year).
    - ALWAYS extract durations with their unit (days, months, years).
    - Identify ALL signatories and their roles.
    - Identify the exact contract type (Master Agreement, Amendment, NDA, Terms and Conditions, etc.).
    - Clause names must be explicit.
    - Link amounts to the relevant services.
    - Extract ALL referenced annexes (Annex 1, Annex 2, etc.).

# =============================================================================
# Extraction examples
# =============================================================================
examples:
  - input: |
      SECNUMCLOUD HOSTING MASTER AGREEMENT
      Between Cloud Temple SAS, represented by Jean Dupont, Chief Executive Officer,
      and TechCorp SARL, represented by Sophie Martin, President,
      for an initial term of 36 months, renewable by tacit renewal.
      Fixed monthly price: EUR 8,500 excl. VAT.
      Availability SLA: 99.95%.
    expected_entities:
      - {name: "Cloud Temple SAS", type: "Party", description: "Provider"}
      - {name: "TechCorp SARL", type: "Party", description: "Customer"}
      - {name: "Jean Dupont", type: "LegalRepresentative", description: "Cloud Temple CEO"}
      - {name: "Sophie Martin", type: "LegalRepresentative", description: "TechCorp President"}
      - {name: "SecNumCloud Hosting Master Agreement", type: "ContractType"}
      - {name: "36 months", type: "Duration", description: "Initial term"}
      - {name: "EUR 8,500 excl. VAT/month", type: "Amount", description: "Fixed monthly price"}
      - {name: "Availability 99.95%", type: "SLA"}
    expected_relations:
      - {from: "Jean Dupont", to: "Cloud Temple SAS", type: "REPRESENTS"}
      - {from: "Sophie Martin", to: "TechCorp SARL", type: "REPRESENTS"}
      - {from: "Contract", to: "36 months", type: "HAS_DURATION"}
      - {from: "Hosting", to: "EUR 8,500 excl. VAT/month", type: "HAS_AMOUNT"}
