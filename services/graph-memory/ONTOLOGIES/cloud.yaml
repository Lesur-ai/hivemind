# =============================================================================
# Cloud Infrastructure Ontology
# =============================================================================
# Specialized for extracting information from documents related to cloud
# infrastructure, data centers, certifications, cloud services, product sheets,
# and Cloud Temple technical documentation.

name: cloud
version: "1.2"
description: |
  Specialized ontology for cloud infrastructure documents.
  Optimized to extract cloud services, architectures, certifications,
  availability zones, configurations, performance indicators,
  pricing, and storage classes.
  Covers product sheets (PRODUCT) and technical documentation (DOCS).

# LLM-specific instructions
context: |
  You are an expert in cloud infrastructure and data centers.
  You must accurately identify:
  - Cloud services (IaaS, PaaS, SaaS) and their characteristics
  - Security certifications (SecNumCloud, ISO 27001, HDS, etc.)
  - Availability zones and regions
  - Technical configurations (CPU, RAM, storage)
  - Performance indicators and SLAs
  - Technologies in use (hypervisors, orchestrators, etc.)
  - Security and compliance aspects
  - Storage classes and their performance levels
  - Backup and replication solutions
  - Pricing models and consumption units
  - AI models and associated services (LLMaaS, GPU)
  
  IMPORTANT: Be precise about technical specifications and certifications.
  For product sheets, always extract pricing, SLAs, and compatibility
  between services.

# =============================================================================
# Cloud-specific entity types
# =============================================================================
entity_types:
  # Cloud services
  - name: CloudService
    description: Cloud service (IaaS, PaaS, SaaS)
    priority: high
    examples:
      - "Infrastructure IaaS SecNumCloud"
      - "Kubernetes as a Service"
      - "Object Storage S3"
      - "Database as a Service"
      - "LLMaaS (Large Language Model as a Service)"
      - "Bastion (secure access)"

  - name: ServiceTier
    description: Service level, offering, tier
    examples:
      - "Standard Offering"
      - "Premium Offering"
      - "Compute Standard"
      - "Storage Performance"
      - "ECO v3"
      - "ADVANCE v3"
      - "PERFORMANCE 1 v3"

  # Infrastructure
  - name: Datacenter
    description: Data center, hosting site
    examples:
      - "DC Paris (PAR7S)"
      - "DC Lyon (TH3S)"
      - "Nanterre Site"
      - "Datacenter AZ07"

  - name: AvailabilityZone
    description: Availability zone
    examples:
      - "AZ-FR1"
      - "Zone A"
      - "PAR7S"
      - "TH3S"
      - "AZ07"

  - name: Region
    description: Cloud geographic region
    examples:
      - "France (FR1)"
      - "Western Europe"
      - "Paris Region"

  # Technologies
  - name: Technology
    description: Technology, technical product, software component
    priority: high
    examples:
      - "VMware vSphere 8"
      - "Kubernetes 1.28"
      - "NetApp ONTAP"
      - "Cisco ACI"
      - "IBM FlashSystem"
      - "IBM Spectrum Virtualize"
      - "Terraform"

  - name: Hypervisor
    description: Hypervisor, virtualization platform
    examples:
      - "VMware ESXi 8.0"
      - "KVM/QEMU"
      - "XCP-ng (Xen)"
      - "Microsoft Hyper-V"

  - name: Orchestrator
    description: Container or service orchestrator
    examples:
      - "Kubernetes"
      - "OpenShift 4.14"
      - "Docker Swarm"
      - "Rancher"

  - name: NetworkComponent
    description: Network component
    examples:
      - "Load Balancer F5"
      - "Firewall Fortinet"
      - "VPN IPSec"
      - "SD-WAN"
      - "Juniper networking"
      - "VPLS"

  # Specifications
  - name: ComputeSpec
    description: Compute specification (CPU, RAM, server blade)
    examples:
      - "8 vCPU"
      - "32 GB RAM"
      - "Intel Xeon Gold 6354"
      - "Cisco UCS B200 M5"
      - "NVIDIA L40S"
      - "NVIDIA H100"

  - name: StorageSpec
    description: Storage specification (capacity, technology)
    examples:
      - "1 TB NVMe SSD"
      - "Block Storage"
      - "Object Storage"
      - "IOPS 10000"
      - "Fiber Channel 32G"
      - "Distributed RAID 6"

  - name: StorageClass
    description: Storage performance class (IOPS/TB level)
    examples:
      - "ECO 500 IOPS/TB"
      - "Standard 1500 IOPS/TB"
      - "Premium 3000 IOPS/TB"
      - "Enterprise 7500 IOPS/TB"
      - "Ultra 15000 IOPS/TB"
      - "Mass Storage"

  - name: NetworkSpec
    description: Network specification
    examples:
      - "10 Gbps bandwidth"
      - "Latency < 5 ms"
      - "Public IP"
      - "Dedicated VLAN"

  # Certifications and security
  - name: Certification
    description: Cloud or security certification
    priority: high
    examples:
      - "SecNumCloud 3.2"
      - "ISO 27001:2022"
      - "HDS"
      - "SOC 2 Type II"
      - "PCI DSS"
      - "ISAE 3402 Type II"
      - "Common Criteria EAL4+"

  - name: SecurityFeature
    description: Security feature
    examples:
      - "AES-256 encryption"
      - "Mandatory MFA"
      - "HSM (Hardware Security Module)"
      - "Thales Luna S790"
      - "KMS / BYOK"
      - "XTS-AES 256 encryption"

  - name: ComplianceFramework
    description: Regulatory compliance framework
    examples:
      - "GDPR"
      - "DORA"
      - "NIS2"
      - "ANSSI PAMS"
      - "HIPAA"
      - "Data Act"

  # Performance et SLA
  - name: SLA
    description: Service-level commitment
    priority: high
    examples:
      - "99.99% availability"
      - "Guaranteed intervention time: 15 minutes"
      - "Guaranteed restoration time: 4 hours"
      - "RPO 1 hour"
      - "RTO 4 hours"

  - name: SLALevel
    description: Priority, impact, or criticality level in the support matrix
    examples:
      - "Priority P1 (intervention time 30 min, performance 95%)"
      - "Priority P2 (intervention time 2 h, performance 90%)"
      - "Priority P3 (intervention time 4 h, performance 90%)"
      - "Impact I1 (Service interruption)"
      - "Impact I2 (Service degradation)"
      - "Criticality C1 (Rapid degradation)"
      - "SLA Priority Matrix"

  - name: PerformanceMetric
    description: Performance metric
    examples:
      - "P99 latency < 10 ms"
      - "Throughput 1 Gbps"
      - "IOPS 50000"
      - "50 devices per appliance"

  # Pricing
  - name: PricingModel
    description: Pricing model, consumption unit, price
    examples:
      - "Hourly billing"
      - "Consumption unit: vCPU/month"
      - "Bastion 3-pack: €1,290/month"
      - "Storage €0.06/GB/month"
      - "Annual commitment -15%"

  # Backup and replication
  - name: BackupSolution
    description: Backup or replication solution
    examples:
      - "IBM Spectrum Protect Plus"
      - "VMware Replication"
      - "Global Mirror"
      - "Metro Mirror"
      - "Veeam Backup"

  # AI and machine learning
  - name: AIModel
    description: Artificial intelligence model
    examples:
      - "Mistral Large 2"
      - "Llama 3.1 70B"
      - "DeepSeek R1 671B"
      - "bge-m3 (embedding)"
      - "Qwen 2.5 Coder"

  # Organizations
  - name: CloudProvider
    description: Cloud service provider
    examples:
      - "Cloud Temple"
      - "AWS"
      - "Microsoft Azure"
      - "OVHcloud"

  - name: Organization
    description: Customer, partner, or regulator organization
    examples:
      - "ANSSI"
      - "CNIL"
      - "Ministry of Health"
      - "Cisco"
      - "IBM"
      - "VMware"

  - name: Role
    description: IAM role, permission profile, or console function
    examples:
      - "Maintainer"
      - "Writer"
      - "Reader"
      - "Writer and Reader"
      - "Administrator"
      - "Operator"

  # APIs and interfaces
  - name: API
    description: Programming interface or management console
    examples:
      - "API REST v2"
      - "Console Shiva"
      - "API OpenStack"
      - "Terraform Provider"
      - "API S3 compatible"

# =============================================================================
# Cloud-specific relationship types
# =============================================================================
relation_types:
  - name: PROVIDES
    description: A provider offers a service
    examples:
      - "Cloud Temple → PROVIDES → IaaS SecNumCloud"

  - name: LOCATED_IN
    description: Located in an availability zone or region
    examples:
      - "Service → LOCATED_IN → DC Paris"
      - "Data → LOCATED_IN → France"

  - name: USES_TECHNOLOGY
    description: Uses a technology
    examples:
      - "IaaS → USES_TECHNOLOGY → VMware vSphere"

  - name: CERTIFIED_FOR
    description: Certified for a standard
    examples:
      - "Cloud Temple → CERTIFIED_FOR → SecNumCloud"
      - "HDS Service → CERTIFIED_FOR → Health Data Hosting"

  - name: HAS_SLA
    description: Has a service-level commitment
    examples:
      - "Standard IaaS → HAS_SLA → 99.95% availability"

  - name: REQUIRES
    description: Requires a component or prerequisite
    examples:
      - "Kubernetes → REQUIRES → Load Balancer"

  - name: INCLUDES
    description: Includes a component or feature
    examples:
      - "Premium Offering → INCLUDES → Automatic Backup"

  - name: CONNECTS_TO
    description: Network connection
    examples:
      - "Client VPC → CONNECTS_TO → Internet Gateway"

  - name: REPLICATED_TO
    description: Replicated to another availability zone
    examples:
      - "Storage → REPLICATED_TO → AZ-FR2"

  - name: COMPLIANT_WITH
    description: Compliant with a regulatory framework
    examples:
      - "Service → COMPLIANT_WITH → GDPR"

  - name: HAS_SPEC
    description: Has a technical specification
    examples:
      - "Large VM → HAS_SPEC → 16 vCPU, 64 GB RAM"

  - name: MANAGED_BY
    description: Managed by a component, tool, or console
    examples:
      - "Cluster → MANAGED_BY → Console Shiva"

  - name: BACKUP_TO
    description: Backed up to
    examples:
      - "Data → BACKUP_TO → Object Storage"

  - name: INTEGRATED_WITH
    description: Integrated with a service or tool
    examples:
      - "Kubernetes → INTEGRATED_WITH → Prometheus"

  # === New v1.1 relations ===

  - name: COMPATIBLE_WITH
    description: Compatible with a tool, format, or service
    examples:
      - "Object Storage → COMPATIBLE_WITH → API S3"
      - "IaaS VMware → COMPATIBLE_WITH → Terraform"
      - "Managed K8s → COMPATIBLE_WITH → Helm"

  - name: SUPPORTS
    description: Supports a protocol, format, or feature
    examples:
      - "Bastion → SUPPORTS → RDP, SSH"
      - "Block Storage → SUPPORTS → Fiber Channel 32G"
      - "Console Shiva → SUPPORTS → API REST"

  - name: PART_OF
    description: Part of a composition hierarchy
    examples:
      - "AZ PAR7S → PART_OF → FR1 Region"
      - "Block Storage → PART_OF → IaaS VMware"
      - "StorageClass Premium → PART_OF → Block Storage"

  - name: DEPENDS_ON
    description: Depends on another service or component
    examples:
      - "Managed Kubernetes → DEPENDS_ON → Block Storage"
      - "Bastion recording → DEPENDS_ON → Object Storage"
      - "VM encryption → DEPENDS_ON → HSM"

  - name: HAS_PRICING
    description: Has a pricing model
    examples:
      - "VMware IaaS → HAS_PRICING → vCPU/hour billing"
      - "Object Storage → HAS_PRICING → €0.06/GB/month"
      - "Bastion → HAS_PRICING → 3-pack: €1,290/month"

# =============================================================================
# Extraction rules
# =============================================================================
extraction_rules:
  max_entities: 60
  max_relations: 80
  
  priority_entities:
    - CloudService
    - Certification
    - SLA
    - Technology
    - Datacenter
    - SecurityFeature
    - StorageClass
    - PricingModel

  special_instructions: |
    # --- BUSINESS EXTRACTION RULES ---
    - Identify ALL mentioned certifications with their version when available.
    - Extract SLAs with their exact values (%, hours, minutes).
    - Identify technologies and their versions.
    - Record technical specifications (CPU, RAM, storage, network).
    - Identify availability zones and regions.
    - Distinguish IaaS, PaaS, and SaaS services.
    - Extract storage classes with their IOPS levels.
    - Identify backup and replication solutions (IBM SPP, VMware Replication, etc.).
    - For product sheets: extract pricing (prices, units, packages).
    - For product sheets: identify service compatibility and dependencies.
    - For AI models (LLMaaS): extract the model name, size, and capabilities.

    # --- REQUIRED MAPPINGS (types that DO NOT EXIST in this ontology) ---

    - ⚠️ Incident priority levels (P1-P5), impact levels (I1-I3), and criticality levels (C1-C3)
      are **SLALevel**. The priority matrix is also an SLALevel.
      Include the intervention time and performance objective in the name
      (for example, "Priority P1 (intervention time 30 min, performance 95%)", not just "Priority_P1").

    - ⚠️ API endpoints (/v1/chat/completions, /v1/models, /v1/completions) are **API**.
      NEVER create an "Endpoint" type — use API.

    - ⚠️ Firewall licenses (FTG2, FTG4, FTG8, vDOM) are **PricingModel**.
      Include the SKU in the name (for example, "FortiGate VM02V License (csp:fr1:licence:fw:ftg2)").
      NEVER create a "Licence" or "License" type — use PricingModel.

    - ⚠️ HA configurations (Active-Passive cluster, failover) are **Technology**.
      (for example, "FortiGate Active-Passive HA Cluster").
      NEVER create an "HACluster" or "HAMode" type.

    - ⚠️ Network capabilities (VLAN tagging, trunking, port mirroring, SRV-IO)
      are **NetworkComponent**.
      NEVER create a "Feature" or "NetworkFeature" type.

    - ⚠️ Physical hosting offerings (shared, dedicated, hands & eyes)
      are **CloudService**.
      NEVER create a "Hosting" or "PhysicalHosting" type.

    - ⚠️ Permission roles (Maintainer, Writer, Reader, Administrator, Operator)
      are **Role**.
      NEVER create a "Permission" or "IAMRole" type.

    - ⚠️ Architectural constraints (requirement for 2 AZs, technical prerequisites)
      are **SLA** or included in the description of the associated CloudService.
      NEVER create a "Requirement" type — use an SLA or a REQUIRES relation.

    - ⚠️ Durations, notice periods, delays, and contractual commitments (3-month notice period, 21-day delay,
      36-month commitment) MUST be INCLUDED in the name of the associated SLA or PricingModel.
      NEVER create a "Duration", "Engagement", "Delay", "Period", or "Timeframe" type.

    - ⚠️ Support languages (French, English) MUST be included in the corresponding SLA
      (for example, "French support 24/7", not a separate "Language_French").
      NEVER create a "Language" type.

    - ⚠️ Operational processes (ticket creation, notification, incident management)
      MUST be included as a description of the CloudService or SLA.
      NEVER create a "Process", "Workflow", or "Procedure" type.

    - ⚠️ Certificates and attestations (deletion certificate, audit report)
      are **SecurityFeature** or **Certification**.

    # --- EXCLUSIONS (DO NOT extract as entities) ---
    
    - ⚠️ DO NOT extract:
      * CLI flags, environment variables, or command options
        ("--overwrite", "--remove", "AWS_REQUEST_CHECKSUM_CALCULATION")
      * File paths or sample names ("./my-site", "demo-app", "poc-helmfile")
      * Isolated error codes ("XAmzContentSHA256Mismatch")
      * Standalone data formats ("JSON", "YAML", "XML")
      * Standalone API parameters ("Parameter model", "Parameter messages")
      * Section titles or guides ("Quick Start Guide", "HA Tutorial")
      * Isolated words without context ("Compute", "Storage", "Network", "Electricity", "Cooling")
      * Isolated numeric identifiers ("Group ID 16", "Priority 100", "Priority 200")
      → These elements MUST be IGNORED or included as attributes of other entities.

    # --- QUALITY ---
    - Each entity MUST have a descriptive, self-contained NAME.
      Bad: "P1", "I2", "FTG4". Good: "Priority P1 (intervention time 30 min)", "Impact I2 (Service degradation)", "FortiGate VM04V License".

# =============================================================================
# Extraction examples
# =============================================================================
examples:
  - input: |
      Cloud Temple offers SecNumCloud 3.2-qualified IaaS infrastructure
      hosted in its French data centers (Paris and Lyon).
      The Compute Standard offering includes VMware vSphere 8 with a 99.95% SLA.
      Block Storage provides 50,000 IOPS with synchronous replication.
    expected_entities:
      - {name: "Cloud Temple", type: "CloudProvider"}
      - {name: "IaaS SecNumCloud", type: "CloudService"}
      - {name: "SecNumCloud 3.2", type: "Certification"}
      - {name: "DC Paris", type: "Datacenter"}
      - {name: "DC Lyon", type: "Datacenter"}
      - {name: "Compute Standard", type: "ServiceTier"}
      - {name: "VMware vSphere 8", type: "Technology"}
      - {name: "99.95% availability", type: "SLA"}
      - {name: "Block Storage", type: "CloudService"}
      - {name: "50000 IOPS", type: "PerformanceMetric"}
    expected_relations:
      - {from: "Cloud Temple", to: "IaaS SecNumCloud", type: "PROVIDES"}
      - {from: "Cloud Temple", to: "SecNumCloud 3.2", type: "CERTIFIED_FOR"}
      - {from: "Compute Standard", to: "VMware vSphere 8", type: "USES_TECHNOLOGY"}
      - {from: "Compute Standard", to: "99.95% availability", type: "HAS_SLA"}

  - input: |
      The Cloud Temple Bastion service provides secure RDP and SSH access
      to hosted infrastructure. It is available as a pack of three appliances
      for €1,290/month. Block Storage provides five performance classes:
      ECO (500 IOPS/TB), Standard (1,500), Premium (3,000), Enterprise (7,500),
      and Ultra (15,000 IOPS/TB). Backup is provided by IBM Spectrum
      Protect Plus with a 24-hour RPO. The service is compatible with Terraform.
    expected_entities:
      - {name: "Bastion", type: "CloudService"}
      - {name: "Cloud Temple", type: "CloudProvider"}
      - {name: "Bastion 3-pack: €1,290/month", type: "PricingModel"}
      - {name: "Block Storage", type: "CloudService"}
      - {name: "ECO 500 IOPS/TB", type: "StorageClass"}
      - {name: "Standard 1500 IOPS/TB", type: "StorageClass"}
      - {name: "Premium 3000 IOPS/TB", type: "StorageClass"}
      - {name: "Enterprise 7500 IOPS/TB", type: "StorageClass"}
      - {name: "Ultra 15000 IOPS/TB", type: "StorageClass"}
      - {name: "IBM Spectrum Protect Plus", type: "BackupSolution"}
      - {name: "RPO 24 hours", type: "SLA"}
      - {name: "Terraform", type: "Technology"}
    expected_relations:
      - {from: "Cloud Temple", to: "Bastion", type: "PROVIDES"}
      - {from: "Bastion", to: "Bastion 3-pack: €1,290/month", type: "HAS_PRICING"}
      - {from: "Bastion", to: "RDP", type: "SUPPORTS"}
      - {from: "Bastion", to: "SSH", type: "SUPPORTS"}
      - {from: "ECO 500 IOPS/TB", to: "Block Storage", type: "PART_OF"}
      - {from: "Block Storage", to: "IBM Spectrum Protect Plus", type: "BACKUP_TO"}
      - {from: "IBM Spectrum Protect Plus", to: "RPO 24 hours", type: "HAS_SLA"}
      - {from: "Bastion", to: "Terraform", type: "COMPATIBLE_WITH"}
