# =============================================================================
# Software Development Ontology
# =============================================================================
# Specialized for extracting knowledge from source code, technical documentation,
# and software-project specifications. Designed to help an AI agent understand a
# project's architecture, components, dependencies, and patterns.
#
# Primary use case: self-ingestion of graph-memory into graph-memory.

name: software-development
version: "1.2"
description: |
  Specialized ontology for software development projects.
  Optimized to extract architecture, components, data models, APIs,
  dependencies, and design patterns from:
  - Source code (Python, JavaScript, TypeScript, Go, Rust, etc.)
  - Technical documentation (README, specifications, ADRs)
  - Configuration files (Docker, CI/CD, environment files)
  - Test files

  The goal is NOT to reproduce an AST (abstract syntax tree), but to capture
  high-level architectural concepts that an AI agent can use.

# LLM-specific instructions
context: |
  You are a senior software architect and expert in code reverse engineering.
  You must precisely identify:
  - The layered architecture and package/module structure
  - The main classes and services with their responsibilities
  - Data models (Pydantic, dataclass, ORM, schemas)
  - Exposed APIs (REST, MCP tools, GraphQL, gRPC)
  - External dependencies (libraries and third-party services)
  - Applied design patterns (Singleton, Repository, Middleware, etc.)
  - Data flows between components
  - Configuration and environment parameters
  - Implemented protocols and standards (MCP, OAuth, S3, etc.)

  IMPORTANT:
  - Prioritize ARCHITECTURAL concepts over implementation details.
  - An entity name must be self-contained and descriptive.
  - Do NOT create an entity for every local variable or trivial constant.
  - Focus on components that have a clear RESPONSIBILITY in the system.
  - For source code, identify the main PUBLIC CLASSES and FUNCTIONS,
    not every private utility method.

# =============================================================================
# Software-development entity types
# =============================================================================
entity_types:

  # ── Architecture and Structure ────────────────────────────────────────────

  - name: Package
    description: High-level package, module, or structuring project directory
    priority: high
    examples:
      - "mcp_memory (main package)"
      - "mcp_memory.core (business layer)"
      - "mcp_memory.auth (authentication layer)"
      - "mcp_memory.tools (MCP tools layer)"
      - "scripts.cli (client CLI)"

  - name: Module
    description: Individual source file (.py, .js, .ts, .go, etc.)
    priority: high
    examples:
      - "server.py (MCP entry point)"
      - "graph.py (Neo4j service)"
      - "extractor.py (LLM extraction)"
      - "ontology.py (ontology management)"
      - "middleware.py (ASGI middleware)"

  - name: Layer
    description: Logical architectural layer of the system
    examples:
      - "Transport Layer (MCP/HTTP)"
      - "Business Logic Layer (core services)"
      - "Authentication Layer"
      - "Persistence Layer (Neo4j, S3, Qdrant)"
      - "Presentation Layer (web UI)"

  # ── Components and Classes ────────────────────────────────────────────────

  - name: Class
    description: Main class, service, or component in the system
    priority: high
    examples:
      - "GraphService (Neo4j graph service)"
      - "ExtractorService (LLM entity extraction)"
      - "StorageService (S3 storage)"
      - "VectorStoreService (Qdrant vector store)"
      - "TokenManager (token management)"
      - "OntologyManager (ontology loading)"
      - "AuthMiddleware (authentication middleware)"

  - name: Function
    description: Important public function or method with a clear responsibility
    examples:
      - "extract_with_ontology() (ontology-guided extraction)"
      - "build_prompt() (LLM prompt construction)"
      - "search() (graph search)"
      - "ingest_document() (document ingestion)"
      - "validate_token() (token validation)"

  - name: Middleware
    description: Middleware or interceptor in the processing chain
    examples:
      - "AuthMiddleware (Bearer-token verification)"
      - "LoggingMiddleware (request logging)"
      - "StaticFilesMiddleware (static files and REST API)"
      - "CORSMiddleware"

  # ── Data Models ───────────────────────────────────────────────────────────

  - name: DataModel
    description: Data model, schema, dataclass, or typed structure
    priority: high
    examples:
      - "ExtractedEntity (LLM-extracted entity)"
      - "ExtractedRelation (extracted relation)"
      - "Memory (knowledge memory/graph)"
      - "Document (ingested document)"
      - "DocumentMetadata (document metadata)"
      - "SearchResult (search result)"
      - "Ontology (ontology definition)"
      - "TokenInfo (token information)"
      - "Chunk (text fragment)"

  - name: Enum
    description: Enumeration or set of constant values
    examples:
      - "EntityType (graph entity types)"
      - "RelationType (relation types)"
      - "SearchMode (search modes: graph, vector, hybrid)"
      - "TokenPermission (read, write, admin)"

  # ── APIs and Interfaces ───────────────────────────────────────────────────

  - name: MCPTool
    description: MCP tool exposed through the Model Context Protocol
    priority: high
    examples:
      - "memory_create (memory creation)"
      - "memory_ingest (document ingestion)"
      - "memory_search (semantic search)"
      - "question_answer (Q&A with RAG)"
      - "memory_graph (graph visualization)"
      - "admin_create_token (token creation)"
      - "backup_create (backup creation)"
      - "ontology_list (ontology listing)"

  - name: APIEndpoint
    description: Exposed REST/HTTP endpoint, route, or URL
    examples:
      - "GET /health (health check)"
      - "GET /api/memories (memory list)"
      - "GET /api/graph/{id} (graph data)"
      - "POST /api/ask (question and answer)"
      - "GET /graph (web visualization)"

  - name: Protocol
    description: Implemented communication protocol or standard
    examples:
      - "MCP (Model Context Protocol)"
      - "Streamable HTTP (MCP transport)"
      - "S3 (object-storage protocol)"
      - "Cypher (Neo4j query language)"
      - "OpenAI API (compatible LLM interface)"
      - "Bearer Token Authentication"

  # ── Infrastructure and Dependencies ───────────────────────────────────────

  - name: ExternalService
    description: External service or infrastructure on which the system depends
    priority: high
    examples:
      - "Neo4j (graph database)"
      - "Qdrant (vector database)"
      - "Dell ECS S3 (object storage)"
      - "Cloud Temple LLMaaS (LLM service)"
      - "Uvicorn (ASGI server)"

  - name: Dependency
    description: External library, framework, or package in use
    examples:
      - "fastapi >= 0.100.0"
      - "mcp >= 1.8.0"
      - "neo4j >= 5.0.0"
      - "qdrant-client >= 1.9.0"
      - "boto3 >= 1.28.0"
      - "pydantic >= 2.0.0"
      - "openai >= 1.0.0"
      - "PyYAML >= 6.0"

  - name: ConfigParameter
    description: Configuration parameter, environment variable, or setting
    examples:
      - "NEO4J_URI (Neo4j connection)"
      - "QDRANT_URL (Qdrant server URL)"
      - "S3_ENDPOINT (S3 endpoint)"
      - "LLMAAS_API_KEY (LLM API key)"
      - "ADMIN_TOKEN (admin bootstrap token)"
      - "LOG_LEVEL (log level)"
      - "MCP_TRANSPORT (transport type: streamable-http)"

  # ── Patterns and Quality ──────────────────────────────────────────────────

  - name: DesignPattern
    description: Design pattern, architectural pattern, or engineering practice
    examples:
      - "Singleton (single service instance)"
      - "Repository Pattern (persistence abstraction)"
      - "Middleware Chain (ASGI middleware chain)"
      - "Lazy Loading (deferred initialization)"
      - "Chunked Processing (processing in chunks)"
      - "Cumulative Context (cumulative context between chunks)"
      - "Graph-Guided RAG (graph-guided augmented retrieval)"
      - "Anti-Hub Rules (hub-node prevention)"

  - name: Algorithm
    description: Algorithm, processing strategy, or data pipeline
    examples:
      - "Ingestion pipeline (upload → chunking → extraction → vectorization)"
      - "Graph-Guided RAG (graph → expansion → vector search → LLM)"
      - "Chunked Extraction (splitting → cumulative extraction → merge)"
      - "Token-based Auth (SHA256 hash → Neo4j → validation)"
      - "Ontology-guided Prompt (build_prompt with types and rules)"

  - name: TestCase
    description: Unit test, integration test, or test scenario
    examples:
      - "test_memory_create (memory creation)"
      - "test_token_validation (token validation)"
      - "test_extraction_with_ontology (guided extraction)"
      - "27/27 Streamable HTTP tests"

  # ── Infrastructure and Deployment (v1.2) ──────────────────────────────────

  - name: InfraComponent
    description: Deployment-infrastructure component (container, WAF, network, or volume)
    examples:
      - "mcp-memory-service (main Docker container)"
      - "Coraza WAF (reverse proxy + application firewall)"
      - "mcp-network (isolated Docker bridge network)"
      - "neo4j_data (persistent Neo4j volume)"
      - "Uvicorn (embedded ASGI server)"
      - "Caddy (WAF HTTP server)"

  - name: SecurityBoundary
    description: Security perimeter, trust zone, or access-control rule
    examples:
      - "WAF Perimeter (OWASP CRS filtering before the service)"
      - "Internal Network (Docker network with no exposed port)"
      - "Bearer Token Auth (token authentication)"
      - "Localhost Bypass (internal requests without authentication)"
      - "Token Scoping (isolation by authorized memory)"
      - "RBAC (read, write, admin permissions)"

  # ── Documentation ─────────────────────────────────────────────────────────

  - name: Documentation
    description: Technical document, specification, ADR, or guide
    examples:
      - "README.md (main documentation)"
      - "SPECIFICATION.md (technical specification)"
      - "CHANGELOG.md (change log)"
      - "Memory Bank (project-context documentation)"
      - "activeContext.md (active context)"
      - "progress.md (progress tracking)"

  - name: Feature
    description: Business feature, capability, or system user story
    examples:
      - "Multi-format ingestion (txt, md, html, docx, pdf, csv)"
      - "Ontology-guided entity extraction"
      - "Hybrid search (graph + vector)"
      - "Question answering with RAG"
      - "Interactive graph visualization"
      - "Backup/restore with tar.gz archives"
      - "Multi-tenant isolation by token"

# =============================================================================
# Software-development relation types
# =============================================================================
relation_types:

  # ── Structure and Composition ─────────────────────────────────────────────

  - name: CONTAINS
    description: Contains (package→module, module→class, class→method)
    examples:
      - "mcp_memory.core → CONTAINS → graph.py"
      - "server.py → CONTAINS → memory_create()"
      - "GraphService → CONTAINS → search()"

  - name: PART_OF
    description: Is part of (inverse hierarchy of CONTAINS)
    examples:
      - "graph.py → PART_OF → mcp_memory.core"
      - "AuthMiddleware → PART_OF → Authentication Layer"

  - name: BELONGS_TO_LAYER
    description: Belongs to an architectural layer
    examples:
      - "GraphService → BELONGS_TO_LAYER → Persistence Layer"
      - "AuthMiddleware → BELONGS_TO_LAYER → Authentication Layer"
      - "memory_search → BELONGS_TO_LAYER → Transport Layer"

  # ── Dependencies and Component Relations ──────────────────────────────────

  - name: DEPENDS_ON
    description: Depends on a component, service, or library
    examples:
      - "GraphService → DEPENDS_ON → Neo4j"
      - "VectorStoreService → DEPENDS_ON → Qdrant"
      - "ExtractorService → DEPENDS_ON → LLMaaS"

  - name: IMPORTS
    description: Imports or uses a module/package
    examples:
      - "server.py → IMPORTS → graph.py"
      - "extractor.py → IMPORTS → ontology.py"

  - name: USES
    description: Uses a service, component, or pattern
    examples:
      - "memory_ingest → USES → ExtractorService"
      - "memory_search → USES → VectorStoreService"
      - "ExtractorService → USES → OntologyManager"

  - name: CALLS
    description: Calls a function or method
    examples:
      - "memory_ingest → CALLS → extract_with_ontology()"
      - "extract_with_ontology() → CALLS → build_prompt()"
      - "question_answer → CALLS → generate_answer()"

  # ── Inheritance and Implementation ────────────────────────────────────────

  - name: INHERITS_FROM
    description: Inherits from a parent class
    examples:
      - "Settings → INHERITS_FROM → BaseSettings (Pydantic)"
      - "AuthMiddleware → INHERITS_FROM → ASGIMiddleware"

  - name: IMPLEMENTS
    description: Implements a pattern, protocol, or interface
    examples:
      - "GraphService → IMPLEMENTS → Singleton"
      - "AuthMiddleware → IMPLEMENTS → Bearer Token Authentication"
      - "server.py → IMPLEMENTS → MCP (Model Context Protocol)"

  # ── Data and Types ────────────────────────────────────────────────────────

  - name: RETURNS
    description: Returns a data type
    examples:
      - "extract_with_ontology() → RETURNS → ExtractionResult"
      - "search() → RETURNS → SearchResult"
      - "validate_token() → RETURNS → TokenInfo"

  - name: ACCEPTS
    description: Accepts a data type as a parameter
    examples:
      - "memory_ingest → ACCEPTS → Document"
      - "build_prompt() → ACCEPTS → Ontology"

  - name: PRODUCES
    description: Produces or generates data
    examples:
      - "ExtractorService → PRODUCES → ExtractedEntity"
      - "ChunkerService → PRODUCES → Chunk"
      - "EmbedderService → PRODUCES → vector embedding"

  - name: STORES_IN
    description: Persists data in a storage system
    examples:
      - "Document → STORES_IN → Dell ECS S3"
      - "ExtractedEntity → STORES_IN → Neo4j"
      - "vector embedding → STORES_IN → Qdrant"

  # ── API and Exposure ──────────────────────────────────────────────────────

  - name: EXPOSES
    description: Exposes a tool, endpoint, or interface
    examples:
      - "server.py → EXPOSES → memory_create"
      - "StaticFilesMiddleware → EXPOSES → GET /api/memories"
      - "server.py → EXPOSES → GET /health"

  - name: DELEGATES_TO
    description: Delegates processing to another component
    examples:
      - "memory_ingest → DELEGATES_TO → ExtractorService"
      - "memory_search → DELEGATES_TO → GraphService"
      - "AuthMiddleware → DELEGATES_TO → TokenManager"

  # ── Actions and Mutations (v1.1) ──────────────────────────────────────────

  - name: UPDATES
    description: Updates, modifies, or writes to a component or state
    examples:
      - "startup_event → UPDATES → APIConfig"
      - "vectorize_all → UPDATES → Qdrant collection"
      - "import_catalog → UPDATES → Product catalog"

  - name: READS
    description: Reads data from a component or storage system
    examples:
      - "get_admin_config → READS → APIConfig"
      - "search_documents → READS → Qdrant collection"
      - "get_offer → READS → SQLAlchemy database"

  # ── Configuration ─────────────────────────────────────────────────────────

  - name: CONFIGURED_BY
    description: Configured by a parameter or environment variable
    examples:
      - "Neo4j → CONFIGURED_BY → NEO4J_URI"
      - "Qdrant → CONFIGURED_BY → QDRANT_URL"
      - "LLMaaS → CONFIGURED_BY → LLMAAS_API_KEY"

  # ── Quality and Documentation ─────────────────────────────────────────────

  - name: TESTED_BY
    description: Tested by a test or test scenario
    examples:
      - "memory_create → TESTED_BY → test_memory_create"
      - "Streamable HTTP → TESTED_BY → 27/27 tests"

  - name: DOCUMENTED_IN
    description: Documented in a file or section
    examples:
      - "Architecture → DOCUMENTED_IN → SPECIFICATION.md"
      - "API → DOCUMENTED_IN → README.md"
      - "Progress → DOCUMENTED_IN → progress.md"

  - name: IMPLEMENTS_FEATURE
    description: Implements a business feature
    examples:
      - "ExtractorService → IMPLEMENTS_FEATURE → Ontology-guided entity extraction"
      - "GraphService + VectorStoreService → IMPLEMENTS_FEATURE → Hybrid search"

  # ── Infrastructure and Security (v1.2) ────────────────────────────────────

  - name: PROTECTS
    description: Protects a component (security perimeter → protected component)
    examples:
      - "Coraza WAF (reverse proxy) → PROTECTS → mcp-memory-service (container)"
      - "Bearer Token Auth → PROTECTS → MCP Tools"
      - "Internal Network (Docker network) → PROTECTS → Neo4j (database)"

  - name: ROUTES_TO
    description: Routes traffic to a component (reverse proxy or load balancer)
    examples:
      - "Coraza WAF → ROUTES_TO → mcp-memory-service (port 8002)"
      - "mcp-memory-service → ROUTES_TO → Neo4j (bolt://neo4j:7687)"
      - "mcp-memory-service → ROUTES_TO → Qdrant (http://qdrant:6333)"

# =============================================================================
# Specific extraction rules
# =============================================================================
extraction_rules:
  max_entities: 160
  max_relations: 240

  priority_entities:
    - Class
    - MCPTool
    - DataModel
    - Package
    - Module
    - ExternalService
    - DesignPattern
    - Feature

  special_instructions: |
    # --- EXTRACTION RULES FOR SOURCE CODE ---

    ## Granularity
    - Extract the main CLASSES and SERVICES, not every private utility method.
    - For functions, retain only those with a clear business responsibility
      (entry points, public APIs, important algorithms).
    - A Module = one source file. A Package = a directory containing __init__.py (Python)
      or package.json (Node.js).

    ## CANONICAL naming (CRITICAL for cross-document merging)

    ⚠️ RULE NO. 1: An entity name must be IDENTICAL in every file
    in which it appears. This is the key to graph deduplication.

    Required format by type:
    - **Class**: "ClassName (short description)" — for example, "VectorizationService (vectorization service)"
      The class name MUST be exactly the name appearing in the code.
      The parenthetical description must be STABLE (do not vary it by context).
    - **Function**: "function_name() (description)" — for example, "vectorize_all() (full vectorization)"
    - **Module**: "file_name.ext (description)" — for example, "main.py (FastAPI entry point)"
    - **Package**: "full.path (description)" — for example, "app.routers (FastAPI routers)"
    - **ExternalService**: "ServiceName (type)" — for example, "Qdrant (vector database)"
    - **ConfigParameter**: "VARIABLE_NAME (description)" — for example, "LLMAAS_API_KEY (LLM API key)"
    - **DataModel**: "ModelName (framework)" — for example, "Offer (SQLAlchemy model)"
    - **Layer**: Stable name — for example, "Business Logic Layer", "Persistence Layer"

    ⚠️ DO NOT vary a description between files!
    Bad: "VectorizationService (class)" in one file, "VectorizationService (vectorization management service)" in another.
    Good: "VectorizationService (vectorization service)" everywhere.

    ## Strict types — DO NOT invent types

    - ⚠️ Decorators, annotations, and metadata are ATTRIBUTES of the decorated entity,
      not separate entities. NEVER create the types "Decorator" or "Annotation".

    - ⚠️ Imports and internal dependencies (between modules in the same project) are
      IMPORTS relations, not Dependency entities. Dependency entities are ONLY
      EXTERNAL packages (pip, npm, cargo, go mod).

    - ⚠️ Instance variables, class attributes, and properties are NOT entities.
      They are characteristics of the Class that contains them.

    - ⚠️ Constants, global variables, and magic numbers are NOT entities,
      EXCEPT when they represent a ConfigParameter exposed to the user.

    - ⚠️ Custom exceptions are **Class** entities, not a separate type.

    - ⚠️ Static files (HTML, CSS, UI JavaScript) are **Module** entities.

    - ⚠️ Dockerfile, docker-compose.yml, Makefile, and CI/CD are **Documentation** entities.

    - ⚠️ TODO, FIXME, and HACK comments are NOT entities.

    # --- REQUIRED RELATION MAPPINGS (DO NOT invent relations) ---

    - ⚠️ "EXECUTES" DOES NOT EXIST → use **CALLS** (function call) or **DELEGATES_TO** (delegation).
    - ⚠️ "IMPLEMENTED_BY" DOES NOT EXIST → reverse the relation and use **IMPLEMENTS** (A IMPLEMENTS B).
    - ⚠️ "USED_IN" DOES NOT EXIST → reverse the relation and use **USES** (A USES B).
    - ⚠️ "USED_BY" DOES NOT EXIST → reverse the relation and use **USES** (A USES B).
    - ⚠️ "BELONGS_TO_CLASS" DOES NOT EXIST → use **PART_OF** or **CONTAINS**.
    - ⚠️ "INSTANCE_OF" DOES NOT EXIST → use **INHERITS_FROM** or **IMPLEMENTS**.
    - ⚠️ "CREATES" DOES NOT EXIST → use **PRODUCES** (data production).
    - ⚠️ "PROVIDES" DOES NOT EXIST → use **EXPOSES** (interface exposure).
    - ⚠️ "ENABLED_BY" DOES NOT EXIST → use **DEPENDS_ON** (dependency).
    - ⚠️ "RELATED_TO" DOES NOT EXIST — it is too vague. Choose a SPECIFIC relation
      (USES, DEPENDS_ON, CALLS, PART_OF, etc.).
    - ⚠️ "DEFINES" DOES NOT EXIST → use **CONTAINS** (a module CONTAINS a class).

    # --- REQUIRED ENTITY MAPPINGS ---

    - ⚠️ Job states and global-state variables (for example, "ImageScanJob", "analyze_state")
      are **Class** or **DataModel** entities, NOT "Other" or "JobState".
      NEVER create the type "Other".

    - ⚠️ Singleton instances (for example, "tool_executor", "gemini_service") are **Class** entities,
      not "Instance" or "Other" entities.

    ## Relations — Minimum connectivity

    ⚠️ Every entity MUST have AT LEAST 2 relations (excluding document MENTIONS).
    If a Function or APIEndpoint has only one relation, add:
    - BELONGS_TO_LAYER → the relevant layer
    - USES → the service or component used
    - RETURNS → the returned data model
    - CONFIGURED_BY → the configuration parameter, when one exists

    ## Relations — Architectural priorities
    - Prioritize ARCHITECTURAL relations (DEPENDS_ON, USES, EXPOSES, DELEGATES_TO)
      over trivial relations (every IMPORTS relation).
    - Extract CALLS relations only for meaningful INTER-COMPONENT calls.
    - CONTAINS is for structural hierarchy (Package→Module→Class→Method).
    - USES is for functional use (Class→ExternalService).
    - UPDATES is for state mutations (Function→DataModel or →ExternalService).
    - READS is for data reads (Function→DataModel or →ExternalService).

    ## Pipeline and data flows
    - Identify processing PIPELINES and model them as Algorithm entities.
    - Identify flows: PRODUCES → STORES_IN → READS → UPDATES.

    # --- ANTI-HUB (v1.1) ---

    - If a Class has more than 30 relations, it is probably a hub.
      In that case, group similar relations and retain only the most significant
      ARCHITECTURAL relations.
    - "Service" classes must NOT be the target of ALL relations in a file.
      Prefer relations to the service's specific Functions rather than the class itself.

    # --- EXCLUSIONS (DO NOT extract as entities) ---

    - ⚠️ DO NOT extract:
      * Local variables, function parameters, or CLI arguments
      * Example file paths or test data
      * Log messages or literal strings
      * Isolated version numbers (except for Dependency entities)
      * Git branch names
      * Code comments or docstrings
      * Python dunder methods (__init__, __str__, __repr__)
      * Trivial getters/setters
    → IGNORE them or include them as attributes of other entities.

    # --- QUALITY ---
    - Every entity must have a descriptive, STABLE, self-contained NAME.
    - Relations must have a clear ARCHITECTURAL meaning.
    - Prefer FEWER well-named entities over MANY generic entities.
    - ZERO entities of type "Other" — everything must be classifiable.

# =============================================================================
# Extraction examples
# =============================================================================
examples:
  - input: |
      # server.py - MCP Memory Service entry point
      from mcp.server.fastmcp import FastMCP
      from .core.graph import GraphService
      from .core.extractor import ExtractorService

      mcp = FastMCP("MCP Memory Service")

      @mcp.tool()
      async def memory_create(memory_id: str, description: str = "") -> dict:
          """Create a new memory (isolated knowledge graph)."""
          graph = await get_graph_service()
          return await graph.create_memory(memory_id, description)

      @mcp.tool()
      async def memory_ingest(memory_id: str, source: str, content: str,
                              ontology: str = "general") -> dict:
          """Ingest a document into a memory."""
          graph = await get_graph_service()
          extractor = await get_extractor_service()
          storage = await get_storage_service()
          # S3 upload, LLM extraction, Neo4j storage, Qdrant vectorization
    expected_entities:
      - {name: "server.py (MCP entry point)", type: "Module"}
      - {name: "FastMCP (MCP framework)", type: "Dependency"}
      - {name: "GraphService (Neo4j graph service)", type: "Class"}
      - {name: "ExtractorService (LLM extraction)", type: "Class"}
      - {name: "memory_create (memory creation)", type: "MCPTool"}
      - {name: "memory_ingest (document ingestion)", type: "MCPTool"}
      - {name: "Ingestion pipeline (S3 → extraction → Neo4j → Qdrant)", type: "Algorithm"}
    expected_relations:
      - {from: "server.py (MCP entry point)", to: "GraphService (Neo4j graph service)", type: "IMPORTS"}
      - {from: "server.py (MCP entry point)", to: "ExtractorService (LLM extraction)", type: "IMPORTS"}
      - {from: "server.py (MCP entry point)", to: "memory_create (memory creation)", type: "EXPOSES"}
      - {from: "server.py (MCP entry point)", to: "memory_ingest (document ingestion)", type: "EXPOSES"}
      - {from: "memory_create (memory creation)", to: "GraphService (Neo4j graph service)", type: "DELEGATES_TO"}
      - {from: "memory_ingest (document ingestion)", to: "ExtractorService (LLM extraction)", type: "DELEGATES_TO"}
      - {from: "memory_ingest (document ingestion)", to: "Ingestion pipeline (S3 → extraction → Neo4j → Qdrant)", type: "IMPLEMENTS"}

  - input: |
      # extractor.py - LLM entity-extraction service
      class ExtractorService:
          """Extract entities and relations through Cloud Temple LLMaaS."""

          def __init__(self):
              self.client = AsyncOpenAI(api_key=settings.LLMAAS_API_KEY)
              self.model = "gpt-oss:120b"

          async def extract_with_ontology(self, text: str, ontology_name: str,
                                          memory_id: str) -> ExtractionResult:
              ontology = manager.get_ontology(ontology_name)
              prompt = ontology.build_prompt(text)
