# =============================================================================
# General-Purpose Ontology
# =============================================================================
# Universal ontology for documents that do not belong to specialized ontologies
# (legal, cloud_products, presales, technical, managed-services). Optimized for
# FAQs, standards, certifications, CSR, product specifications, knowledge bases,
# RFIs/RFPs, metrics, and customer references.

name: general
version: "1.1"
description: |
  General ontology for extracting information from any type of professional document:
  FAQs, normative standards, partner product sheets, CSR reports, Q&A knowledge
  bases, and performance indicators.

  Designed as an intelligent safety net: broad but meaningful types, with strict
  mappings to avoid "Other" entities.

context: |
  You are an expert in knowledge extraction from varied professional documents.
  You must identify key entities and their relations in heterogeneous documents:
  FAQs, standards, certifications, environmental reports, technical specifications, and more.

  ⚠️ CRITICAL EXTRACTION RULES:

  1. QUESTIONS AND ANSWERS: If the document is structured as Q&A or FAQ,
     extract each question as a Question entity and its answer as an Answer entity.
     ALWAYS link them with the ANSWERS relation.

  2. VALUE PRECISION: Extract exact metrics with units.
     ✅ Good: "99.99%", "2,133 tCO2e", "EUR 0.9/million tokens", "42 Gbps"
     ❌ Bad: "high availability", "low carbon footprint"

  3. INDICATORS AND TARGETS: For KPIs, ALWAYS extract the current value
     AND the target when available. Include both in the entity name.
     Example: "NPS 42 (2024, target 50 in 2025)", not just "NPS".

  4. CUSTOMER REFERENCES: Include budget, duration, and sector in the name.
     Example: "Acme Corp (EUR 2.5M/year, 10 years, Industry/Energy)", not just "Acme Corp".

  5. PRODUCT SPECIFICATIONS: For product matrices (Fortinet, servers, etc.),
     each model is a ProductModel with its Specifications.
     Do NOT create one entity for each isolated technical value.

  6. FAQ COVERAGE: If an answer indicates "Available: Yes/No" and
     "Coverage: Full/Partial", include that information in the Answer entity.

# =============================================================================
# ENTITY TYPES (28 types, 5 families)
# =============================================================================
entity_types:

  # ---------------------------------------------------------------------------
  # 📚 FAMILY 1: KNOWLEDGE AND CONTENT
  # ---------------------------------------------------------------------------
  - name: Topic
    description: Subject, theme, or knowledge domain
    examples:
      - "Network (section 2.1.1)"
      - "Object storage (section 2.1.2)"
      - "Identity and access management"
      - "Environmental impact"
      - "LLM quantization"

  - name: Question
    description: Asked question, stated requirement, or point to investigate
    priority: high
    examples:
      - "Network equipment management: segmentation?"
      - "SNC qualification date (obtained or estimated)?"
      - "Which Fortinet model supports 100k sessions?"
      - "What is the relationship between ATOS and Cloud Temple?"

  - name: Answer
    description: Structured answer to a question (including availability and coverage for an FAQ)
    priority: high
    examples:
      - "Available: Yes, Full — VLAN segmentation through Shiva Console"
      - "Not available — no native security groups; filtering through dedicated firewalls"
      - "Cloud Temple is a NEURONES Group subsidiary, not an ATOS subsidiary"

  - name: Definition
    description: Formal explanation of a term, concept, or technology
    examples:
      - "tCO2e: tonne of CO2 equivalent (standardized unit)"
      - "Quantization: reducing the precision of an LLM's weights"
      - "PUE: Power Usage Effectiveness (data-center energy efficiency)"

  - name: Fact
    description: Verifiable factual statement with a precise value
    examples:
      - "SecNumCloud qualification obtained on 30/05/2025"
      - "S3 API compatibility: 97%"
      - "Inter-AZ backbone: 2x100 Gbps"

  # ---------------------------------------------------------------------------
  # 🏢 FAMILY 2: ORGANIZATIONS AND ACTORS
  # ---------------------------------------------------------------------------
  - name: Organization
    description: Company, agency, institution, or organization
    examples:
      - "Cloud Temple"
      - "NEURONES Group"
      - "ANSSI"
      - "Bpifrance"
      - "ADEME"
      - "Fortinet"

  - name: Person
    description: Named natural person
    examples:
      - "Jean Dupont (Chief Technical Officer)"

  - name: ClientReference
    description: Customer reference with context (sector, budget, duration, and scope)
    priority: high
    examples:
      - "Agralis Group (Agrifood, EUR 1.5M/year, 800 VMs)"
      - "FinRegul (Financial regulator, EUR 1.2M/year, 500 VMs)"
      - "AquaNova (Environment, EUR 2.5M/year, 200+ VMs, 10 years, NIS2)"
      - "Health Agency — Emergency Information System (Healthcare, EUR 600k/year)"

  - name: Partner
    description: Technology, commercial, or integration partner
    examples:
      - "AlphaTech (partner for public tenders)"
      - "CyberSec Partners (ANSSI-qualified CERT)"
      - "DefenseTech (defense/healthcare partnership)"
      - "AuditConseil (HDS compliance)"

  - name: Stakeholder
    description: Stakeholder identified in a materiality analysis, CSR report, or actor mapping
    examples:
      - "Stakeholder — Employees (Workforce, 2024)"
      - "Stakeholder — Product users (Customers, 2024)"
      - "Stakeholder — Hosting providers (Infrastructure, 2024)"
      - "Stakeholder — Communities (Civil society, 2024)"
      - "Stakeholder — Nature (Environment, 2024)"

  # ---------------------------------------------------------------------------
  # ⚙️ FAMILY 3: PRODUCTS AND TECHNOLOGY
  # ---------------------------------------------------------------------------
  - name: Product
    description: Commercialized service, offering, or solution
    priority: high
    examples:
      - "IaaS VMware"
      - "LLMaaS (LLM as a Service)"
      - "Managed Kubernetes"
      - "S3 Object Storage"
      - "Managed 24/7 SOC"
      - "Bare Metal (for Oracle/SAP)"

  - name: ProductModel
    description: Specific model or SKU with its characteristics (hardware, appliance, configuration)
    priority: high
    examples:
      - "FortiGate FG-900G (164 Gbps FW, 55G IPsec, 16M sessions)"
      - "FortiGate FG-100F (20 Gbps FW, 1.5M sessions, 1RU)"
      - "Cisco UCS B200 M5 (compute blade)"
      - "Thales Luna S790 (HSM FIPS 140-3 L3)"

  - name: Technology
    description: Technology, software, protocol, or technical standard
    examples:
      - "VMware vSphere"
      - "Red Hat OpenShift"
      - "Fortinet FortiGate"
      - "IBM FlashSystem"
      - "Terraform"
      - "Kubernetes"
      - "Stormshield (ANSSI-qualified)"

  - name: Specification
    description: Precise technical value with a unit
    examples:
      - "Firewall 164 Gbps (1518B)"
      - "16 million concurrent sessions"
      - "3.78 μs latency"
      - "25 Gbps per blade"
      - "95th-percentile bandwidth"

  - name: PricingInfo
    description: Price, billing model, or cost structure
    examples:
      - "EUR 0.9/million input tokens (LLMaaS)"
      - "EUR 4/million output tokens"
      - "EUR 0.03 excl. VAT/GiB/month (object storage)"
      - "95th-percentile billing (bandwidth)"
      - "No egress charges"

  # ---------------------------------------------------------------------------
  # 🛡️ FAMILY 4: COMPLIANCE AND COMMITMENTS
  # ---------------------------------------------------------------------------
  - name: Certification
    description: Standard, label, qualification, or official certification
    priority: high
    examples:
      - "SecNumCloud v3.2 (ANSSI, 30/05/2025)"
      - "ISO 27001:2022 (Certi-Trust, 16/12/2027)"
      - "HDS activities 2 to 6 (Certi-Trust, 16/12/2027)"
      - "ISAE 3402 Type II"
      - "C5 (Naolys Audit, 31/05/2026)"

  - name: Regulation
    description: Law, directive, or regulatory framework
    examples:
      - "NIS2 (EU Directive 2022/2555)"
      - "DORA (EU Regulation 2022/2554)"
      - "GDPR"
      - "SecNumCloud Framework v3.2"
      - "HDS Framework"

  - name: Requirement
    description: Requirement, need, or constraint (customer, regulatory, or technical)
    examples:
      - "Data localization in France"
      - "Healthcare data hosting"
      - "Disaster Recovery Plan with zero RPO"
      - "East-west network filtering"

  - name: SLA
    description: Quantified service-level commitment
    examples:
      - "Availability 99.99%"
      - "GTI 15 minutes"
      - "GTR 4 hours"
      - "Optional 24/7 support"

  - name: LegalProvision
    description: Article of law, recital, provision, amendment, or annex of a regulatory text
    priority: high
    examples:
      - "Article 21 — Cybersecurity risk-management measures (NIS2)"
      - "Article 17 — ICT incident-management process (DORA)"
      - "Article 32 — Oversight measures for essential entities"
      - "Recital 45 — Principle of proportionality"
      - "Annex I — Highly critical sectors (NIS2)"

  - name: Sector
    description: Regulated sector or subsector (NIS2, DORA, or NACE annexes)
    examples:
      - "Energy sector (critical, NIS2 Annex I)"
      - "Electricity subsector (network operators, producers)"
      - "Digital infrastructure sector (DNS, registries, IXPs)"
      - "Banking sector (credit institutions)"
      - "Medical-device manufacturing sector (NACE)"

  - name: Sanction
    description: Administrative sanction, fine, periodic penalty, enforcement measure, or regulatory penalty
    examples:
      - "Administrative fine — minimum EUR 10M or 2% worldwide turnover (NIS2 essential entities)"
      - "Administrative fine — minimum EUR 7M or 1.4% worldwide turnover (NIS2 important entities)"
      - "Periodic penalty — maximum 1% daily worldwide turnover for 6 months (DORA)"
      - "Temporary suspension of a certification or authorization"
      - "Temporary prohibition on exercising management duties"

  # ---------------------------------------------------------------------------
  # 📊 FAMILY 5: INDICATORS AND STRATEGY
  # ---------------------------------------------------------------------------
  - name: KPI
    description: Measurable performance indicator with a value and target
    priority: high
    examples:
      - "NPS 42 (2024, target 50 in 2025)"
      - "PUE < 1.45"
      - "GHG emissions 2,133 tCO2e (2023)"
      - "Carbon intensity 47 kg CO2e/EUR k turnover"
      - "Gender equality index 89% (2024, target 90% in 2025)"
      - "Employees trained in digital responsibility 79% (target 100%)"

  - name: Target
    description: Quantified target with a deadline
    examples:
      - "−41% relative emissions by 2030"
      - "−30% GHG per euro spent"
      - "Net-zero scope 1/2 −90% by 2050 (SBTi)"
      - "Gender parity in management (ratio = 1)"
      - "75% end-of-life data-center recovery (2025)"

  - name: Action
    description: Concrete measure, initiative, or action plan
    examples:
      - "Eco-conditions in procurement policy"
      - "Extended server lifespan (3→7 years)"
      - "Electric vehicle fleet replacement"
      - "Climate-awareness workshop"
      - "SAP S4/HANA migration to trusted cloud"

  - name: Evidence
    description: Formal proof, report, certificate, or source document
    examples:
      - "ANSSI Decision No. 918/ANSSI/SDE/NP"
      - "Decarbonization Diagnostic Report (Bpifrance, 12/2024)"
      - "ISO 27001 Certificate (Certi-Trust)"
      - "ISAE 3402 Type II Attestation (Guibert & Co)"

# =============================================================================
# RELATION TYPES (24 types, 6 families)
# =============================================================================
relation_types:

  # ---------------------------------------------------------------------------
  # KNOWLEDGE
  # ---------------------------------------------------------------------------
  - name: ANSWERS
    description: An answer addresses a question
    priority: high
    examples:
      - "VLAN segmentation answer → ANSWERS → Network-management question"

  - name: COVERS
    description: A product, answer, or document covers a topic
    examples:
      - "IaaS VMware → COVERS → Block-storage topic"
      - "SSE encryption answer → COVERS → Object-storage topic"

  - name: DEFINES
    description: A definition explains a term
    examples:
      - "tCO2e definition → DEFINES → GHG emissions"

  - name: PROVEN_BY
    description: A statement is proven by a source document
    priority: high
    examples:
      - "SecNumCloud certification → PROVEN_BY → ANSSI Decision No. 918"

  # ---------------------------------------------------------------------------
  # CAPABILITY AND COMPLIANCE
  # ---------------------------------------------------------------------------
  - name: PROVIDES
    description: An organization provides a product or service
    examples:
      - "Cloud Temple → PROVIDES → IaaS VMware"

  - name: HAS_CERTIFICATION
    description: An entity holds a certification
    priority: high
    examples:
      - "Secure Temple IaaS → HAS_CERTIFICATION → SecNumCloud v3.2"
      - "Cloud Temple → HAS_CERTIFICATION → ISO 27001:2022"

  - name: COMPLIANT_WITH
    description: A service complies with a regulation
    examples:
      - "Object storage → COMPLIANT_WITH → GDPR"

  - name: HAS_SLA
    description: A product is associated with a service-level commitment
    priority: high
    examples:
      - "IaaS VMware → HAS_SLA → Availability 99.99%"

  - name: REQUIRES
    description: An entity requires a prerequisite
    examples:
      - "Healthcare hosting → REQUIRES → HDS certification"

  # ---------------------------------------------------------------------------
  # TECHNOLOGY AND PRODUCT
  # ---------------------------------------------------------------------------
  - name: USES_TECHNOLOGY
    description: A product uses a technology
    examples:
      - "Network security → USES_TECHNOLOGY → Fortinet FortiGate"

  - name: HAS_MODEL
    description: A product or product range includes a specific model
    examples:
      - "FortiGate → HAS_MODEL → FG-900G (164 Gbps)"

  - name: HAS_SPEC
    description: A model has a technical specification
    examples:
      - "FG-900G → HAS_SPEC → 16M concurrent sessions"

  - name: PRICED_AT
    description: A product has a price
    examples:
      - "LLMaaS → PRICED_AT → EUR 0.9/M input tokens"

  - name: INTEGRATES_WITH
    description: A product integrates with another
    examples:
      - "Shiva Console → INTEGRATES_WITH → Terraform"

  # ---------------------------------------------------------------------------
  # REFERENCES AND ACTORS
  # ---------------------------------------------------------------------------
  - name: DEPLOYED_FOR
    description: A product or solution has been deployed for a customer
    priority: high
    examples:
      - "SecNumCloud Cloud → DEPLOYED_FOR → FinRegul (500 VMs, EUR 1.2M/year)"

  - name: PARTNERED_WITH
    description: An organization has a partnership with another
    examples:
      - "Cloud Temple → PARTNERED_WITH → AlphaTech"

  # ---------------------------------------------------------------------------
  # STRATEGY AND INDICATORS
  # ---------------------------------------------------------------------------
  - name: MEASURED_BY
    description: An entity is measured by an indicator
    examples:
      - "Data-center energy efficiency → MEASURED_BY → PUE < 1.45"

  - name: TARGETS
    description: A KPI or action targets an objective
    examples:
      - "Decarbonization plan → TARGETS → −41% emissions by 2030"

  - name: ADDRESSES
    description: An action addresses an issue or risk
    examples:
      - "Extended server lifespan → ADDRESSES → Capital-equipment carbon footprint"

  # ---------------------------------------------------------------------------
  # STRUCTURE
  # ---------------------------------------------------------------------------
  - name: PART_OF
    description: An entity is part of a larger whole
    examples:
      - "Object storage → PART_OF → Expected capabilities topic"

  - name: RELATED_TO
    description: Generic relation (last resort)
    examples:
      - "Concept A → RELATED_TO → Concept B"

  - name: SUPERSEDES
    description: A version replaces an earlier version
    examples:
      - "SecNumCloud v3.2 → SUPERSEDES → SecNumCloud v3.1"

  # ---------------------------------------------------------------------------
  # REGULATORY
  # ---------------------------------------------------------------------------
  - name: APPLIES_TO
    description: A regulatory text or provision applies to a sector or category of entities
    examples:
      - "NIS2 → APPLIES_TO → Digital infrastructure sector"
      - "DORA → APPLIES_TO → Financial entity"

  - name: IMPOSES
    description: A regulation or authority imposes a sanction or obligation
    examples:
      - "NIS2 Article 34 → IMPOSES → EUR 10M administrative fine"
      - "DORA Article 35 → IMPOSES → 1% daily-turnover periodic penalty"

# =============================================================================
# EXTRACTION RULES
# =============================================================================
extraction_rules:
  max_entities: 60
  max_relations: 80

  priority_entities:
    - Question
    - Answer
    - Product
    - ProductModel
    - Certification
    - ClientReference
    - KPI
    - SLA
    - LegalProvision
    - Sanction

  special_instructions: |
    # --- RULES FOR FAQS / Q&A ---
    - If the document is structured in Q&A sections, each question = one Question entity
      and each answer = one Answer entity, linked with ANSWERS.
    - Include "Available: Yes/No" and "Coverage: Full/Partial"
      in the Answer name (for example, "Yes, Full — VLAN segmentation").
    - DO NOT create one entity per FAQ section. Create individual Question entities.

    # --- RULES FOR CUSTOMER REFERENCES ---
    - ALWAYS include annual budget, VM count, relationship duration, and sector
      in the ClientReference entity name.
      ✅ "FinRegul (Regulator, EUR 1.2M/year, 500 VMs)"
      ❌ "FinRegul" alone + a separate "Budget EUR 1.2M" entity

    # --- RULES FOR PRODUCT SPECS (Fortinet, servers, etc.) ---
    - Each distinct model = one ProductModel entity.
    - Key specifications (throughput, sessions, latency, interfaces) = Specification entities
      linked through HAS_SPEC.
    - DO NOT create one entity per table row. Group data by model.

    # --- RULES FOR CSR INDICATORS ---
    - A KPI must ALWAYS contain: name + value + year + target when available.
      ✅ "NPS 42 (2024, target 50 in 2025)"
      ❌ "NPS" alone
    - CSR action plans = Action entities, linked to Targets through TARGETS.

    # --- REQUIRED MAPPINGS (anti-"Other") ---

    - ⚠️ Amounts (budget, price, contract value, turnover) must be
      INCLUDED in ClientReference, PricingInfo, or KPI. NEVER create the types
      "MonetaryAmount", "Amount", "Budget", or "Revenue".

    - ⚠️ Durations (contract, project, commitment, validity) must be INCLUDED
      in the name of the associated entity (ClientReference, Certification, SLA).
      NEVER create the types "Duration", "Period", or "Timeframe".

    - ⚠️ Dates (award, expiry, publication) must be INCLUDED in the entity name.
      Example: "SecNumCloud v3.2 (30/05/2025, valid through 30/05/2028)".
      NEVER create the types "Date" or "Timestamp".

    - ⚠️ Isolated percentages and scores must be included in a KPI or SLA.
      NEVER create the types "Percentage", "Score", or "Metric" — use KPI.

    - ⚠️ Section names, document titles, and headings are NOT entities.
      NEVER create the types "Section", "Chapter", or "DocumentTitle".

    - ⚠️ Operational processes (incident management, maintenance, managed services) are Product entities.
      NEVER create the types "Process" or "Workflow".

    - ⚠️ Role profiles (SDM, architect, engineer) are Person entities only when NAMED;
      otherwise IGNORE them. NEVER create the types "JobTitle" or "Profile".

    - ⚠️ Standalone units of measure (Gbps, IOPS, tCO2e, EUR) are NOT entities.
      They must be included in Specification, KPI, or PricingInfo.

    # --- EXCLUSIONS ---
    - ⚠️ DO NOT extract as entities:
      * Isolated words without context ("Security", "Performance", "Network")
      * Standalone abbreviations without a definition ("HA", "DR", "NR")
      * Section numbers ("2.1.1", "Section 3.2")
      * Vague formulations ("high availability", "enhanced security")
      * CLI parameters or environment variables
      → These elements must be IGNORED or included as attributes.

    # --- RULES FOR REGULATORY TEXTS (NIS2, DORA, SecNumCloud, HDS, PAMS) ---
    - Each numbered article of a law/directive/regulation = LegalProvision.
      Include the number AND title in the name.
      ✅ "Article 21 — Cybersecurity risk-management measures (NIS2)"
      ❌ "Article 21" alone
    - Recitals = LegalProvision entities as well.
    - Numbered annexes = LegalProvision entities ("Annex I — Highly critical sectors").
    - Sectors and subsectors of regulatory annexes = Sector entities.
      ✅ "Energy sector (critical, NIS2 Annex I)"
      ❌ "Energy" alone
    - Sanctions (fines, periodic penalties, suspensions, prohibitions) = Sanction entities.
      ALWAYS include the amount/threshold when available.
      ✅ "Administrative fine — minimum EUR 10M or 2% worldwide turnover (NIS2 essential entities)"
      ❌ "Administrative fine" alone

    # --- RULES FOR CSR / MATERIALITY REPORTS ---
    - Stakeholders in materiality analyses = Stakeholder entities.
      ✅ "Stakeholder — Hosting providers (Infrastructure, 2024)"
      ❌ "Hosting providers" alone
    - CSR impacts, risks, and opportunities = KPIs (include nature +/− and horizon).
    - General-assembly resolutions = Action entities.
    - Free-share plans / share buybacks = Action entities.

    # --- ADDITIONAL REQUIRED MAPPINGS (anti-"Other") ---

    - ⚠️ ANSSI qualifications (PAMS, PASSI, PDIS, PRIS, SecNumCloud) = Certification.
      NEVER create the types "Qualification" or "Acronym".

    - ⚠️ Official reports (ENISA, CSIRT, EU-CyCLONe, CSR reports) = Evidence.
      NEVER create the types "Report" or "Publication".

    - ⚠️ Security zones (trusted zone, interconnection zone) = Topic.
      NEVER create the types "Zone", "SecurityZone", or "Component".

    - ⚠️ Committees (audit committee, ethics committee, group committee) = Organization.
      NEVER create the type "Committee".

    - ⚠️ Board meetings and general assemblies = Action.
      NEVER create the types "Meeting", "Event", or "Session".

    - ⚠️ Roles (CISO, DPO) = Person only when NAMED; otherwise IGNORE them.
      NEVER create the types "Role" or "JobTitle".

    - ⚠️ Standalone acronyms (DSCP, ISMS) = Definition.
      NEVER create the type "Acronym".

    - ⚠️ ANSSI guides and frameworks (GUIDE_ACHAT, NT_ADMIN) = Evidence.

    - ⚠️ Standalone deadlines must be INCLUDED in LegalProvision or Requirement.
      ✅ "Article 41 — Transposition (deadline 17/10/2024)"
      ❌ "Deadline 17 October 2024" as a separate entity

    - ⚠️ Standalone durations (5 years, 26 months) = INCLUDED in the parent entity.
      ❌ "Duration 5 years" as a separate entity

    - ⚠️ Frequencies (quarterly, semiannual) = INCLUDED in Evidence.
      ✅ "ENISA summary report (quarterly)"
      ❌ "Quarterly frequency" as a separate entity

    - ⚠️ Financial limits (caps, discounts, thresholds) = INCLUDED in Action.
      ❌ "Maximum issuance capacity EUR 9M" as a separate entity

    - ⚠️ Statuses ("Unused", "In progress") are NOT entities. IGNORE them.

    # --- NAME QUALITY ---
    - Each entity must have a descriptive, self-contained name.
      ✅ "FortiGate FG-900G (164 Gbps FW, 16M sessions)"
      ❌ "FG-900G"
      ✅ "SecNumCloud v3.2 (ANSSI, 30/05/2025)"
      ❌ "SecNumCloud"
      ✅ "GHG emissions 2,133 tCO2e (FY2023, −41% target 2030)"
      ❌ "GHG emissions"

# =============================================================================
# EXTRACTION EXAMPLES
# =============================================================================
examples:
  - context: "ANSSI RFI FAQ — Network section"
    input: |
      ## 2.1.1 Network — Anti-DDoS protection
      **Cloud Temple answer:**
      - **Available:** Yes
      - **Coverage:** Full
      - **Details:** Volumetric DDoS protection is included by default,
        with upstream filtering by operator partners.
    expected_entities:
      - {name: "Anti-DDoS protection available?", type: "Question"}
      - {name: "Yes, Full — Volumetric DDoS included, upstream operator filtering", type: "Answer"}
      - {name: "Network (section 2.1.1)", type: "Topic"}
      - {name: "Anti-DDoS (included in Internet connectivity)", type: "Product"}
    expected_relations:
      - {from: "Yes, Full — Volumetric DDoS", to: "Anti-DDoS protection available?", type: "ANSWERS"}
      - {from: "Anti-DDoS protection available?", to: "Network (section 2.1.1)", type: "PART_OF"}
      - {from: "Anti-DDoS", to: "Cloud Temple", type: "PROVIDES"}

  - context: "Customer reference — AquaNova"
    input: |
      Customer: AquaNova Group
      Infrastructure: SecNumCloud trusted cloud, CMP Shiva, NIS2.
      More than 200 VMs, annual cost of EUR 2.5M, renewed trust for 10 years.
    expected_entities:
      - {name: "AquaNova (Environment, EUR 2.5M/year, 200+ VMs, 10 years, NIS2)", type: "ClientReference"}
      - {name: "SecNumCloud trusted cloud", type: "Product"}
      - {name: "CMP Shiva Console", type: "Technology"}
      - {name: "NIS2 (EU Directive 2022/2555)", type: "Regulation"}
    expected_relations:
      - {from: "SecNumCloud trusted cloud", to: "AquaNova", type: "DEPLOYED_FOR"}
      - {from: "AquaNova", to: "NIS2", type: "COMPLIANT_WITH"}

  - context: "CSR report — indicators"
    input: |
      Total emissions: 2,133 tCO2e (FY2023).
      Carbon intensity: 47 kg CO2e / EUR k turnover.
      Target: −41% relative emissions by 2030.
    expected_entities:
      - {name: "GHG emissions 2,133 tCO2e (FY2023)", type: "KPI"}
      - {name: "Carbon intensity 47 kg CO2e/EUR k turnover (FY2023)", type: "KPI"}
      - {name: "−41% relative emissions by 2030", type: "Target"}
    expected_relations:
      - {from: "GHG emissions 2,133 tCO2e", to: "−41% relative emissions 2030", type: "TARGETS"}

  - context: "NIS2 Article — Sanctions"
    input: |
      Article 34 — General conditions for imposing administrative fines.
      Fines for essential entities amount to a minimum of
      EUR 10,000,000 or 2% of annual worldwide turnover.
      Important entities: minimum EUR 7,000,000 or 1.4%.
      NIS2 applies to highly critical sectors (Annex I), including Energy.
    expected_entities:
      - {name: "Article 34 — General conditions for administrative fines (NIS2)", type: "LegalProvision"}
      - {name: "Fine — minimum EUR 10M or 2% worldwide turnover (NIS2 essential entities)", type: "Sanction"}
      - {name: "Fine — minimum EUR 7M or 1.4% worldwide turnover (NIS2 important entities)", type: "Sanction"}
      - {name: "Energy sector (critical, NIS2 Annex I)", type: "Sector"}
    expected_relations:
      - {from: "Article 34 — General conditions", to: "Fine — minimum EUR 10M", type: "IMPOSES"}
      - {from: "NIS2", to: "Energy sector", type: "APPLIES_TO"}
