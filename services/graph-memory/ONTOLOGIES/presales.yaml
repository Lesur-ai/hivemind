# =============================================================================
# Presales Ontology (Presales and Commercial Proposals)
# =============================================================================
# Specialized for extracting information from Cloud Temple's presales knowledge
# base and generating responses to requests for proposal or information (RFP/RFI).

name: presales
version: "1.1"
description: |
  Specialized ontology for analyzing presales documents and generating
  commercial proposals for sovereign cloud services (SecNumCloud).
  Optimized to link customer requirements to Cloud Temple capabilities,
  services, certifications, and methodologies.

# LLM-specific instructions
context: |
  You are a senior Cloud Temple presales expert specializing in trusted cloud services (SecNumCloud).
  Your role is to analyze knowledge-base documents and extract key arguments,
  technical characteristics, and commitments that address customer needs.

  ⚠️ CRITICAL EXTRACTION RULES:

  1. DOMAIN CONTEXT: Every extracted entity MUST be linked to its source domain
     through the PART_OF_DOMAIN relation (for example, "SecNumCloud" → "Security and Compliance").

  2. PERSONA ORIENTATION: Systematically identify the persona targeted by each argument.
     - Financial/risk arguments → Executive / Buyer
     - Technical/performance arguments → CIO / Technical Expert
     - Compliance/security arguments → CISO / DPO

  3. CROSS-DOMAIN RELATIONS: Actively look for links between silos:
     - How does a "Certification" (Security) affect a "Service" (Technical)?
     - How does a "Methodology" (Governance) guarantee an "SLA" (Contractual)?

  4. CUSTOMER REQUIREMENTS: If the text mentions a typical customer need
     (for example, "need for sovereignty"), create a "Requirement" entity and
     link it to the proposed solution through "ANSWERED_BY".

  5. VALUE PRECISION: Extract exact metrics (99.99%, <4ms, 24/7, PUE 1.3).
     Do not generalize ("high availability" → look for the percentage) unless no value is stated.

# =============================================================================
# Entity types (24 types across 6 families)
# =============================================================================
entity_types:

  # ---------------------------------------------------------------------------
  # 🏢 FAMILY 1: ACTORS AND PEOPLE
  # ---------------------------------------------------------------------------
  - name: Organization
    description: Company, legal entity, partner, or public body
    examples:
      - "Cloud Temple"
      - "Neurones Group"
      - "ANSSI"
      - "Cisco (Partner)"
      - "Agralis Group (Customer)"

  - name: Person
    description: Named natural person (expert, executive, or key contact)
    examples:
      - "Jean Dupont (Chief Executive Officer)"
      - "Marie Martin (Chief Technical Officer)"
      - "Chief Information Security Officer (CISO) (when named)"

  - name: Role
    description: Functional role or key position in the organization or project
    examples:
      - "Service Delivery Manager (SDM)"
      - "Cloud Architect"
      - "DPO (Data Protection Officer)"
      - "Technical Account Manager (TAM)"

  - name: Team
    description: Operational team, department, or organizational unit
    examples:
      - "SOC (Security Operations Center)"
      - "Service Center"
      - "Project Management Office"
      - "Incident response team (CSIRT)"

  - name: Persona
    description: Target customer-contact profile addressed by the content
    examples:
      - "Executive (Focus: Risk, ROI, Sovereignty)"
      - "CIO (Focus: Architecture, Integration, Operations)"
      - "CISO (Focus: Compliance, Audits, Threats)"
      - "Buyer (Focus: Costs, Pricing model, Penalties)"
      - "Technical Expert (Focus: Specifications, Performance, APIs)"

  # ---------------------------------------------------------------------------
  # 🛡️ FAMILY 2: SECURITY AND COMPLIANCE
  # ---------------------------------------------------------------------------
  - name: Certification
    description: Standard, label, qualification, or official certification
    priority: high
    examples:
      - "SecNumCloud (ANSSI qualification)"
      - "HDS (Healthcare Data Hosting)"
      - "ISO 27001"
      - "ISAE 3402 Type II"
      - "Tier III+"

  - name: Regulation
    description: Applicable law, regulation, or legal framework
    examples:
      - "GDPR (General Data Protection Regulation)"
      - "DORA (Digital Operational Resilience Act)"
      - "NIS2"
      - "French Data Protection Act"

  - name: SecurityPolicy
    description: Internal policy, security procedure, technical control, or physical security measure
    examples:
      - "PSSI (Information System Security Policy)"
      - "Encryption policy"
      - "Vulnerability management"
      - "Principle of least privilege"
      - "Certified media destruction"
      - "Secure asset transport"
      - "Physical access logs"
      - "Simulated phishing campaigns (SETA)"

  # ---------------------------------------------------------------------------
  # ⚙️ FAMILY 3: TECHNOLOGY AND INFRASTRUCTURE
  # ---------------------------------------------------------------------------
  - name: Platform
    description: Software tool, portal, or major interface
    examples:
      - "Shiva Console"
      - "Customer Portal"
      - "VMware hypervisor"
      - "Kubernetes orchestrator"

  - name: Technology
    description: Technology, hardware, software, or specific AI model in use
    examples:
      - "IBM FlashSystem (Storage)"
      - "Cisco UCS (Compute)"
      - "Fortinet (Security)"
      - "Red Hat OpenShift"
      - "Veeam Backup"
      - "Llama 3.3 70B (AI model)"
      - "Mistral Small (AI model)"
      - "DeepCoder (code-specialized AI model)"

  - name: Infrastructure
    description: Structuring physical or logical infrastructure component
    examples:
      - "Interxion data center"
      - "Telehouse 3 data center"
      - "100 Gbps backbone"
      - "Availability Zone (AZ)"
      - "Storage LUN"

  - name: Service
    description: Commercialized service or delivered service
    priority: high
    examples:
      - "IaaS VMware"
      - "SecNumCloud hosting"
      - "24/7 SOC"
      - "Backup as a Service"
      - "LLMaaS (LLM as a Service)"

  # ---------------------------------------------------------------------------
  # 📋 FAMILY 4: GOVERNANCE AND METHODOLOGY
  # ---------------------------------------------------------------------------
  - name: Methodology
    description: Named method, framework, or structured approach
    examples:
      - "ARISTOTE (Operations methodology)"
      - "MATTIS (Transition methodology)"
      - "ITIL v4"
      - "Agile / Scrum"

  - name: Governance
    description: Steering body, committee, management process, or governance cadence
    examples:
      - "Steering Committee (COPIL)"
      - "Strategic Committee"
      - "Change Advisory Board (CAB)"
      - "Monthly service review"
      - "Weekly committee"
      - "Quarterly review"
      - "Semiannual steering committee"

  - name: ProjectPhase
    description: Project stage or service lifecycle phase
    examples:
      - "Scoping phase"
      - "Transition phase (Build)"
      - "Operations phase (Run)"
      - "Reversibility phase"

  - name: Deliverable
    description: Document or artifact produced as part of the service
    examples:
      - "Quality Assurance Plan (PAQ)"
      - "Technical Architecture Document (DAT)"
      - "Monthly service report"
      - "Reversibility Plan"

  # ---------------------------------------------------------------------------
  # 💰 FAMILY 5: COMMERCIAL AND VALUE
  # ---------------------------------------------------------------------------
  - name: Differentiator
    description: Unique strength, competitive advantage, or key argument
    examples:
      - "Data sovereignty (immunity from extraterritorial laws)"
      - "100% France-based support"
      - "No ingress/egress charges"
      - "Capital independence (Neurones Group)"

  - name: ValueProposition
    description: Customer benefit or value promise
    examples:
      - "Reduced time to market"
      - "Cost control (FinOps)"
      - "Immediate regulatory compliance"
      - "Guaranteed business continuity"

  - name: SLA
    description: Service level, quantified commitment, or penalty
    priority: high
    examples:
      - "Availability 99.95%"
      - "GTI 15 minutes"
      - "GTR 4 hours"
      - "Liquidated damages"

  - name: PricingModel
    description: Billing model, unit of work, or cost structure
    examples:
      - "Unit of Work (UO)"
      - "Usage-based billing (Pay-as-you-go)"
      - "Monthly fixed price"
      - "Reserved instances (1 year / 3 years)"

  - name: Quote
    description: Quantified estimate or typical budget for a given scenario
    examples:
      - "Estimated monthly budget: EUR 5k"
      - "3-year TCO: EUR 150k"
      - "Setup cost (NRC): EUR 10k"

  - name: Constraint
    description: Limit, applicability condition, or exclusion
    examples:
      - "Minimum 36-month commitment"
      - "Valid only in metropolitan France"
      - "Excludes Oracle licenses"
      - "Requires a dedicated MPLS connection"

  - name: Requirement
    description: Customer need, requirement, or constraint (explicit or implicit)
    priority: high
    examples:
      - "Healthcare data hosting"
      - "Sovereignty requirement"
      - "Disaster Recovery Plan (DRP)"
      - "Full reversibility"

  # ---------------------------------------------------------------------------
  # 📊 FAMILY 6: CONTEXT AND METRICS
  # ---------------------------------------------------------------------------
  - name: ClientReference
    description: Customer reference cited as evidence (including name, sector, annual budget, and relationship duration when available)
    examples:
      - "Agralis Group (Industry, EUR 1.5M/year)"
      - "National Health Agency (Public sector)"
      - "Advanced Research Institute (EUR 5M/year, for 10 years)"
      - "AquaNova (Managed services, EUR 2.5M/year, 10 years)"
      - "Science Lab (36 months, Research)"

  - name: KPI
    description: Performance indicator, quantified metric, or score
    examples:
      - "PUE < 1.3 (Energy efficiency)"
      - "NPS > 70 (Net Promoter Score)"
      - "First-call resolution rate"
      - "Carbon footprint (gCO2e/kWh)"

  - name: PresalesDomain
    description: Knowledge-base subject domain (source folder)
    examples:
      - "Company and Identity (00)"
      - "Governance and Steering (01)"
      - "Security and Compliance (02)"
      - "Technical Platform (03)"
      - "Managed Services (04)"
      - "Project and Transition (05)"
      - "Contractual and Financial Aspects (06)"
      - "Corporate Social Responsibility (CSR) (07)"
      - "Commercial Strategy (08)"
      - "CT Security Policy (09)"

  - name: Evidence
    description: Formal proof, source document, or artifact supporting a statement
    examples:
      - "ISO 27001 certificate (PDF)"
      - "SOC 2 Type II audit report"
      - "Performance benchmark (June 2025)"
      - "Shiva Console screenshot"

  - name: ProposalSection
    description: Typical section of a tender response
    examples:
      - "Executive Summary"
      - "Compliance Matrix"
      - "Technical Architecture"
      - "Transition Plan"
      - "Price Schedule (BPU)"

# =============================================================================
# Relation types (28 types across 5 families)
# =============================================================================
relation_types:

  # ---------------------------------------------------------------------------
  # CAPABILITY AND COMPLIANCE
  # ---------------------------------------------------------------------------
  - name: PROVIDES
    description: An organization provides a service or technology
    examples:
      - "Cloud Temple → PROVIDES → SecNumCloud IaaS"

  - name: HAS_CERTIFICATION
    description: An entity holds or is covered by a certification
    priority: high
    examples:
      - "Interxion data center → HAS_CERTIFICATION → ISO 27001"
      - "Cloud Temple → HAS_CERTIFICATION → HDS"

  - name: COMPLIANT_WITH
    description: An entity complies with a regulation or policy
    examples:
      - "Storage service → COMPLIANT_WITH → GDPR"
      - "Architecture → COMPLIANT_WITH → PSSI"

  - name: GUARANTEES
    description: An entity guarantees a service level or characteristic
    priority: high
    examples:
      - "IaaS service → GUARANTEES → Availability 99.95%"
      - "24/7 SOC → GUARANTEES → GTI 15min"

  - name: REQUIRES
    description: An entity requires a prerequisite (certification, technology, etc.)
    examples:
      - "Healthcare hosting → REQUIRES → HDS certification"
      - "Shiva Console → REQUIRES → MFA authentication"

  # ---------------------------------------------------------------------------
  # TECHNOLOGY
  # ---------------------------------------------------------------------------
  - name: RUNS_ON
    description: A service runs on a technology or infrastructure component
    examples:
      - "IaaS VMware → RUNS_ON → Cisco UCS"
      - "Container as a Service → RUNS_ON → Red Hat OpenShift"

  - name: HOSTED_AT
    description: A service or device is hosted at a location
    examples:
      - "Production platform → HOSTED_AT → Telehouse 3 data center"

  - name: INTEGRATES_WITH
    description: A technology integrates or connects with another
    examples:
      - "Shiva Console → INTEGRATES_WITH → Customer ITSM"
      - "Backbone → INTEGRATES_WITH → Customer network (MPLS)"

  - name: MANAGED_BY
    description: A service is managed by a team or tool
    examples:
      - "Firewall → MANAGED_BY → Network Team"
      - "Standard requests → MANAGED_BY → Shiva Console"

  - name: POWERED_BY
    description: A service is powered by a partner technology
    examples:
      - "Storage → POWERED_BY → IBM FlashSystem"

  # ---------------------------------------------------------------------------
  # GOVERNANCE
  # ---------------------------------------------------------------------------
  - name: FOLLOWS_METHODOLOGY
    description: A service or project follows a specific methodology
    examples:
      - "Service Center → FOLLOWS_METHODOLOGY → ARISTOTE"
      - "Migration project → FOLLOWS_METHODOLOGY → MATTIS"

  - name: GOVERNED_BY
    description: An activity is governed by a governance body
    examples:
      - "Project → GOVERNED_BY → COPIL"
      - "Service quality → GOVERNED_BY → Monthly review"

  - name: RESPONSIBLE_FOR
    description: A role or team is responsible for an activity
    examples:
      - "SDM → RESPONSIBLE_FOR → Monthly reporting"
      - "SOC → RESPONSIBLE_FOR → Security incident management"

  - name: INCLUDES_PHASE
    description: A methodology or project includes a phase
    examples:
      - "Transition project → INCLUDES_PHASE → Build phase"

  - name: DELIVERS
    description: A phase or activity produces a deliverable
    examples:
      - "Scoping phase → DELIVERS → Architecture Document (DAT)"

  # ---------------------------------------------------------------------------
  # COMMERCIAL
  # ---------------------------------------------------------------------------
  - name: DIFFERENTIATES_FROM
    description: An element differentiates the offer from the market
    examples:
      - "French support → DIFFERENTIATES_FROM → US hyperscalers"

  - name: TARGETS_PERSONA
    description: An argument or service specifically addresses a persona
    priority: high
    examples:
      - "FinOps model → TARGETS_PERSONA → Buyer"
      - "Legal immunity → TARGETS_PERSONA → Executive"
      - "API automation → TARGETS_PERSONA → Technical Expert"

  - name: PRICED_AS
    description: A service is billed under a model
    examples:
      - "VM → PRICED_AS → Usage-based billing"

  - name: HAS_SLA
    description: A service is associated with a specific SLA
    examples:
      - "Critical service → HAS_SLA → GTR 2h"

  - name: REFERENCED_BY
    description: A service or capability is validated by a customer reference
    examples:
      - "Large-scale migration → REFERENCED_BY → Agralis Group"

  - name: ANSWERED_BY
    description: A customer requirement is covered by a solution or argument
    priority: high
    examples:
      - "Sovereignty need → ANSWERED_BY → SecNumCloud"
      - "DRP requirement → ANSWERED_BY → Synchronous replication service"

  # ---------------------------------------------------------------------------
  # STRUCTURE AND CONTEXT
  # ---------------------------------------------------------------------------
  - name: PART_OF_DOMAIN
    description: An entity belongs to a knowledge domain (folder)
    priority: high
    examples:
      - "ARISTOTE methodology → PART_OF_DOMAIN → Governance and Steering"
      - "SecNumCloud → PART_OF_DOMAIN → Security and Compliance"

  - name: RELATED_TO
    description: Generic relation (last resort)
    examples:
      - "Concept A → RELATED_TO → Concept B"

  - name: SUPERSEDES
    description: A version or entity replaces an earlier one
    examples:
      - "2026 catalog → SUPERSEDES → 2025 catalog"

  - name: CONTAINS
    description: An entity contains sub-elements
    examples:
      - "IaaS offering → CONTAINS → Compute, Storage, Network"

  - name: MEASURES
    description: A KPI measures the performance of an entity
    examples:
      - "PUE → MEASURES → Data-center energy efficiency"

  - name: ADDRESSES_RISK
    description: A policy or measure addresses a risk
    examples:
      - "Immutable backup → ADDRESSES_RISK → Ransomware"

  - name: DEPENDS_ON
    description: An entity functionally depends on another
    examples:
      - "DRP → DEPENDS_ON → Inter-site link"

  - name: PROVEN_BY
    description: A statement is proven by a source document (Evidence)
    priority: high
    examples:
      - "HDS compliance → PROVEN_BY → HDS Certificate 2025.pdf"
      - "Disk performance → PROVEN_BY → IOPS benchmark"

  - name: CONSTRAINED_BY
    description: An offer or service is subject to a constraint
    examples:
      - "Volume discount → CONSTRAINED_BY → 36-month commitment"
      - "SLA 99.99% → CONSTRAINED_BY → High-availability architecture"

# =============================================================================
# Specific extraction rules
# =============================================================================
extraction_rules:
  # Extraction limits (adapted to the richness of the presales ontology: 24 types x 28 relations)
  max_entities: 60
  max_relations: 80

  # Value-proposition focus
  extract_value_propositions: true
  extract_differentiators: true

  # Data precision
  extract_exact_metrics: true
  infer_personas: true  # Infer the target persona when it is not explicit

  # Priority entities
  priority_entities:
    - Service
    - Certification
    - Differentiator
    - Requirement
    - SLA
    - ClientReference

  # Contextual instructions
  special_instructions: |
    - If a paragraph starts with "For the CIO..." or "As an Executive...",
      IMMEDIATELY create a TARGETS_PERSONA relation.

    - Treat "Units of Work" (UO) as PricingModel entities.

    - Do not confuse "Cloud Temple" (Organization) with "Shiva Console" (Platform).

    - Clearly distinguish "SecNumCloud" (Certification) from the "SecNumCloud hosting" offering (Service).
      Relation: Service → HAS_CERTIFICATION → Certification.

    - For Customer References, look for the triplet: Customer Name + Sector + Use Case.
      Include the annual budget and relationship duration in the ClientReference entity NAME
      (for example, "AquaNova (EUR 2.5M/year, 10 years)", not two separate entities: "AquaNova" + "Budget EUR 2.5M").

    - ⚠️ REQUIRED MAPPING: the "MonetaryAmount" and "Duration" types DO NOT EXIST in this ontology.
      If you want to extract an amount (budget, price, contract value), include it in the related
      ClientReference or PricingModel entity. If you want to extract a duration (contract, project,
      relationship), include it in the relevant ClientReference, ProjectPhase, or SLA entity name.
      NEVER create an entity of type "MonetaryAmount", "Duration", "Amount", or "Budget".

    - AI models (LLMs and embeddings) are Technology entities: "Llama 3.3 70B" → Technology.

    - Physical security measures (certified destruction, secure transport, access control)
      are SecurityPolicy entities, NOT "Other".

    - Committee frequencies (weekly, monthly, quarterly) must be INCLUDED in the name
      of the corresponding Governance entity (for example, "Monthly review", not a separate "Monthly" entity).

    - ⚠️ DO NOT extract as entities:
      * Document section headings ("Introduction", "General Overview", "Organization")
      * Isolated words with no business value ("Systems", "Storage", "Middleware")
      * Frequencies or durations without context ("Monthly", "Weekly", "2-month duration")
      → These elements must be INCLUDED as attributes of other entities or ignored.

    - RACI activities (requirements definition, validation, acceptance, delivery)
      are ProjectPhase entities, NOT "Other".

    - Named operational processes (incident management, risk management)
      are Methodology entities, NOT "Other".
