# =============================================================================
# Managed Services / IT Outsourcing Ontology
# =============================================================================
# Specialized for extracting information from documents related to IT
# outsourcing, managed services, operations, support, and RACI.

name: managed-services
version: "1.0"
description: |
  Specialized ontology for managed-services and IT outsourcing documents.
  Optimized to extract responsibility scopes, support SLAs,
  ITIL processes, incidents, changes, and RACI matrices.

# LLM-specific instructions
context: |
  You are an expert in managed services and IT outsourcing.
  You must accurately identify:
  - Responsibility scopes (customer vs. provider)
  - ITIL processes (incidents, problems, changes, releases)
  - Support SLAs (intervention time, restoration time, service windows)
  - Roles and responsibilities (RACI)
  - Escalations and on-call coverage
  - Ticketing tools and interfaces
  - Performance indicators (KPIs)
  
  IMPORTANT: Clear responsibilities are crucial in managed services.
  Clearly identify WHO does WHAT and WHEN.

# =============================================================================
# Managed-services-specific entity types
# =============================================================================
entity_types:
  # Scopes and services
  - name: ManagedService
    description: Provided managed service
    examples:
      - "System administration"
      - "24/7 monitoring"
      - "Backup management"
      - "Patch management"

  - name: ServicePerimeter
    description: Service scope (included or excluded)
    examples:
      - "Operations Scope"
      - "Level 1-2-3 IT outsourcing"
      - "OS administration"
      - "Out of scope: application development"

  - name: SupportLevel
    description: Support level
    examples:
      - "Level 1 support (help desk)"
      - "Level 2 support (expertise)"
      - "Level 3 support (vendor)"
      - "24/7 on-call coverage"

  # ITIL processes
  - name: ITILProcess
    description: ITIL process
    examples:
      - "Incident management"
      - "Problem management"
      - "Change management"
      - "Release management"

  - name: Incident
    description: Incident type or severity
    examples:
      - "P1 incident (critical)"
      - "P2 incident (major)"
      - "P3 incident (minor)"
      - "Security incident"

  - name: ChangeType
    description: Change type
    examples:
      - "Standard change"
      - "Normal change"
      - "Urgent change"
      - "Emergency change"

  # SLAs and commitments
  - name: SLA
    description: Support service-level commitment
    priority: high
    examples:
      - "P1 intervention time: 15 minutes"
      - "P1 restoration time: 4 hours"
      - "Response time: 1 business hour"
      - "Level 1 resolution rate: 80%"

  - name: ServiceWindow
    description: Service window
    examples:
      - "Business hours: 8:00-18:00"
      - "Non-business hours"
      - "24/7/365"
      - "Business days in France"

  - name: Astreinte
    description: On-call service
    examples:
      - "24/7 on-call coverage"
      - "Weekend on-call coverage"
      - "Level 3 escalation"

  # Roles and responsibilities
  - name: Role
    description: Role in the service organization
    examples:
      - "Service Delivery Manager"
      - "Technical Manager"
      - "Level 2 Analyst"
      - "DBA"

  - name: Team
    description: Team or group
    examples:
      - "Operations Team"
      - "NOC (Network Operations Center)"
      - "SOC (Security Operations Center)"
      - "CAB (Change Advisory Board)"

  - name: RACIResponsibility
    description: RACI responsibility
    examples:
      - "R - Responsible"
      - "A - Accountable"
      - "C - Consulted"
      - "I - Informed"

  # Tools and interfaces
  - name: Tool
    description: Service-management tool
    examples:
      - "ServiceNow"
      - "JIRA Service Management"
      - "Console Shiva"
      - "Nagios/Centreon"

  - name: Interface
    description: Interface or portal
    examples:
      - "Customer portal"
      - "Ticketing system"
      - "Monitoring dashboard"
      - "API ITSM"

  # Deliverables and reports
  - name: Deliverable
    description: Service deliverable
    examples:
      - "Monthly activity report"
      - "Steering committee"
      - "Service review"
      - "Capacity plan"

  - name: KPI
    description: Performance indicator
    examples:
      - "MTTR (Mean Time To Repair)"
      - "MTBF (Mean Time Between Failures)"
      - "Availability rate"
      - "Number of incidents/month"

  # People and organizations
  - name: Person
    description: Contact or person responsible
    examples:
      - "Customer Account Manager"
      - "CISO"
      - "DPO"

  - name: Organization
    description: Organization involved
    examples:
      - "Cloud Temple Operations"
      - "Customer IT Team"
      - "Software vendor"

  # Activities and tasks
  - name: Activity
    description: Operations activity
    examples:
      - "Proactive monitoring"
      - "Monthly patch management"
      - "Security log review"
      - "Restore test"

  - name: MaintenanceWindow
    description: Maintenance window
    examples:
      - "Monthly maintenance: first Sunday"
      - "Emergency maintenance"
      - "Update window"

# =============================================================================
# Managed-services-specific relationship types
# =============================================================================
relation_types:
  - name: PROVIDES
    description: Provides a service
    examples:
      - "Cloud Temple → PROVIDES → 24/7 monitoring"

  - name: RESPONSIBLE_FOR
    description: Responsible for (RACI - R)
    examples:
      - "Operations Team → RESPONSIBLE_FOR → Incident management"

  - name: ACCOUNTABLE_FOR
    description: Accountable for (RACI - A)
    examples:
      - "Service Delivery Manager → ACCOUNTABLE_FOR → SLA"

  - name: CONSULTED_FOR
    description: Consulted for (RACI - C)
    examples:
      - "Customer → CONSULTED_FOR → Major changes"

  - name: INFORMED_OF
    description: Informed of (RACI - I)
    examples:
      - "Management → INFORMED_OF → P1 incidents"

  - name: HAS_SLA
    description: Has an SLA
    examples:
      - "P1 incident → HAS_SLA → P1 intervention time: 15 minutes"

  - name: ESCALATES_TO
    description: Escalates to
    examples:
      - "N1 → ESCALATES_TO → N2"
      - "N2 → ESCALATES_TO → On-call coverage"

  - name: USES_TOOL
    description: Uses a tool
    examples:
      - "Operations → USES_TOOL → ServiceNow"

  - name: PART_OF
    description: Is part of
    examples:
      - "Patch management → PART_OF → Operations"

  - name: REQUIRES_APPROVAL
    description: Requires approval
    examples:
      - "Major change → REQUIRES_APPROVAL → CAB"

  - name: PRODUCES
    description: Produces a deliverable
    examples:
      - "Steering committee → PRODUCES → Meeting minutes"

  - name: MEASURED_BY
    description: Measured by a KPI
    examples:
      - "Support quality → MEASURED_BY → MTTR"

  - name: APPLIES_TO
    description: Applies to
    examples:
      - "P1 SLA → APPLIES_TO → Critical infrastructure"

  - name: DURING
    description: During a service window
    examples:
      - "Level 1 support → DURING → Business hours 8:00-18:00"

  - name: EXCLUDES
    description: Excludes from scope
    examples:
      - "Operations Scope → EXCLUDES → Development"

  - name: INCLUDES
    description: Includes in scope
    examples:
      - "Operations Scope → INCLUDES → Monitoring"

# =============================================================================
# Extraction rules
# =============================================================================
extraction_rules:
  max_entities: 60
  max_relations: 80
  include_metrics: true
  include_durations: true
  include_amounts: false  # Less relevant for pure IT outsourcing
  extract_implicit_relations: true
  
  priority_entities:
    - ManagedService
    - SLA
    - SupportLevel
    - Role
    - RACIResponsibility
    - Activity

  special_instructions: |
    - Identify ALL SLAs with their values (intervention time, restoration time, response time).
    - Distinguish support levels (N1, N2, N3).
    - Record service windows (business hours, non-business hours, 24/7).
    - Identify RACI responsibilities.
    - Distinguish what is INCLUDED from what is EXCLUDED from scope.
    - Identify escalation processes.

# =============================================================================
# Extraction examples
# =============================================================================
examples:
  - input: |
      The Cloud Temple Operations Team provides 24/7 infrastructure monitoring.
      P1 intervention time: 15 minutes; restoration time: 4 hours.
      Level 1 support is available during business hours (8:00-18:00), with
      Level 2/3 on-call coverage outside business hours.
      A monthly activity report is provided at the steering committee.
      Monthly patch management is performed on the first Sunday of each month.
    expected_entities:
      - {name: "Cloud Temple Operations Team", type: "Team"}
      - {name: "24/7 monitoring", type: "ManagedService"}
      - {name: "P1 intervention time: 15 minutes", type: "SLA"}
      - {name: "P1 restoration time: 4 hours", type: "SLA"}
      - {name: "Level 1 support", type: "SupportLevel"}
      - {name: "Business hours 8:00-18:00", type: "ServiceWindow"}
      - {name: "Level 2/3 on-call coverage", type: "Astreinte"}
      - {name: "Monthly activity report", type: "Deliverable"}
      - {name: "Steering committee", type: "Deliverable"}
      - {name: "Monthly patch management", type: "Activity"}
      - {name: "First Sunday of the month", type: "MaintenanceWindow"}
    expected_relations:
      - {from: "Operations Team", to: "24/7 monitoring", type: "RESPONSIBLE_FOR"}
      - {from: "P1 incident", to: "P1 intervention time: 15 minutes", type: "HAS_SLA"}
      - {from: "Level 1 support", to: "Business hours 8:00-18:00", type: "DURING"}
