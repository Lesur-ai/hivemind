# =============================================================================
# Cloud Service Management Ontology
# =============================================================================
# Specialized for extracting knowledge from documentation about operating and
# managing a cloud service: LLMaaS, DBaaS, Agent-as-a-Service,
# Kubernetes-as-a-Service, Object Storage, and more.

name: cloud-service-management
version: "1.0"
description: |
  Ontology for managed cloud services operated in production.
  It covers both the service exposed to customers, its technical components,
  operations, billing, quotas, SLAs, incidents, changes, runbooks, and
  compliance requirements.

  This ontology is intentionally generic: it is suitable for an LLMaaS,
  DBaaS, Agent-as-a-Service, managed Kubernetes service, object storage,
  managed API, or any other "as-a-service" cloud service.

context: |
  You are a senior cloud architect specializing in operating managed cloud
  services in production.

  You must identify precisely:
  - The exposed cloud service, its offerings, endpoints, and capabilities.
  - The technical components that deliver this service: proxy, API gateway,
    runtime, database, workers, orchestrators, and load balancers.
  - Infrastructure resources: hosts, GPUs/CPUs, storage, networking,
    regions, zones, and environments.
  - Operational mechanisms: monitoring, alerting, incidents, problems,
    changes, RFCs, decisions, validations, and runbooks.
  - Service-governance elements: customers, tenants, quotas, metering,
    pricing, SLAs/SLOs, compliance, and security controls.

  IMPORTANT:
  - Do not specialize extraction for LLMaaS. LLMaaS is only an example.
  - Never create an "Other" type. Use the closest type.
  - Prefer durable, actionable facts for an operations agent.
  - Secrets, tokens, passwords, and API keys must never be extracted as
    entities. If a document mentions a secret, extract only the
    secret-management mechanism, not its value.
  - Long logs and command outputs are not entities. They may support a
    Validation, an Incident, or an OperationalDecision.

entity_types:
  # Service and exposure
  - name: CloudService
    description: Managed cloud service exposed to customers or users
    priority: high
    examples:
      - "LLMaaS Cloud Temple"
      - "Database as a Service PostgreSQL"
      - "Agent-as-a-Service"
      - "Object Storage S3 compatible"
      - "Managed Kubernetes"

  - name: ServiceOffering
    description: Commercial offering, tier, plan, mode, or service variant
    examples:
      - "Standard offering"
      - "Premium offering"
      - "Dedicated inference"
      - "PostgreSQL HA"
      - "Agent Runtime Enterprise"

  - name: ServiceCapability
    description: Functional capability provided by the service
    examples:
      - "Chat completions"
      - "Embeddings"
      - "Rerank"
      - "Automatic backup"
      - "Tool calling"

  - name: APIEndpoint
    description: API endpoint, route, MCP interface, console, or public interface
    priority: high
    examples:
      - "POST /v1/chat/completions"
      - "POST /v1/embeddings"
      - "GET /v1/models"
      - "memory_search (MCP tool)"
      - "DBaaS administration console"

  - name: Tenant
    description: Tenant, customer space, project, customer organization, or isolation domain
    examples:
      - "Production tenant"
      - "Healthcare customer project"
      - "LLMaaS space"
      - "Object namespace"

  - name: Client
    description: Customer, consumer, client application, or external integration
    examples:
      - "Legifrance portal"
      - "Control Center"
      - "Customer business application"

  # Technical components
  - name: ServiceComponent
    description: Technical component participating in the service
    priority: high
    examples:
      - "API Gateway"
      - "Reverse proxy"
      - "Billing worker"
      - "Scheduler"
      - "Control plane"

  - name: RuntimeEngine
    description: Execution engine, runtime, inference server, or database engine
    priority: high
    examples:
      - "vLLM"
      - "Ollama"
      - "PostgreSQL 17"
      - "Qdrant"
      - "Agent runtime"

  - name: Workload
    description: Executable instance, daemon, container, systemd service, job, or deployment
    examples:
      - "llm-proxy-rust.service"
      - "vllm@ia21.service"
      - "postgresql.service"
      - "billing-recompute job"

  - name: DataStore
    description: Database, bucket, file store, queue, topic, or application storage
    examples:
      - "Neo4j graph store"
      - "Qdrant collection"
      - "S3 billing bucket"
      - "PostgreSQL primary database"

  - name: ConfigurationItem
    description: Configuration file, environment variable, parameter, or configuration item
    priority: high
    examples:
      - "instance.yaml"
      - "config.toml"
      - "API_BASE_URL"
      - "pricing.yaml"
      - "systemd unit override"

  - name: AutomationTool
    description: Script, pipeline, deployment tool, administration tool, or automated command
    examples:
      - "deploy_bm.py"
      - "diagnose_mac_proxy_remote.py"
      - "Terraform module"
      - "Ansible playbook"
      - "CI deployment pipeline"

  # Infrastructure
  - name: InfrastructureNode
    description: Host, VM, bare-metal server, appliance, GPU server, node, or execution machine
    priority: high
    examples:
      - "ai-server-rtx6000-12"
      - "db-primary-01"
      - "load-balancer-01"
      - "worker-node-03"

  - name: ComputeResource
    description: Compute resource or accelerator
    examples:
      - "NVIDIA RTX 6000 Ada"
      - "NVIDIA L40S"
      - "AMD Radeon AI PRO R9700"
      - "32 vCPU"
      - "128 GB RAM"

  - name: StorageResource
    description: Storage resource, volume, storage class, or capacity
    examples:
      - "NVMe local"
      - "Block Storage Premium"
      - "Object Storage bucket"
      - "2 TB volume"

  - name: NetworkComponent
    description: Network component, VIP, router, firewall, load balancer, or connectivity
    examples:
      - "Load Balancer public"
      - "VIP 192.168.25.10"
      - "Firewall egress"
      - "Private backend network"

  - name: Environment
    description: Logical environment or lifecycle stage
    examples:
      - "production"
      - "preproduction"
      - "staging"
      - "sandbox"

  - name: Region
    description: Region, geographic area, data center, or availability zone
    examples:
      - "FR1"
      - "PAR7S"
      - "TH3S"
      - "France region"

  # Specialized but generic business capabilities
  - name: ManagedResource
    description: Resource managed by the service on behalf of a tenant
    examples:
      - "AI model"
      - "PostgreSQL instance"
      - "Conversational agent"
      - "Cluster Kubernetes"
      - "Object bucket"

  - name: DataModel
    description: Data model, schema, request/response format, or API contract
    examples:
      - "OpenAI chat completion schema"
      - "UsageRecord"
      - "TenantQuota"
      - "DatabaseConnectionString"

  # Service governance
  - name: BillingMeter
    description: Usage meter or billable unit of measure
    priority: high
    examples:
      - "tokens_in"
      - "tokens_out"
      - "Rerank request x1M"
      - "vCPU-hour"
      - "GiB-month"

  - name: PricingRule
    description: Pricing rule, pricing unit, billing formula, or price exception
    priority: high
    examples:
      - "Rerank billed per million requests"
      - "PostgreSQL billed per vCPU/month"
      - "Storage billed per GB/month"
      - "Annual commitment discount"

  - name: QuotaPolicy
    description: Quota, limit, rate limit, reservation, or capacity policy
    examples:
      - "100 RPM per tenant"
      - "1M tokens/day limit"
      - "Maximum 20 connexions"
      - "Dedicated GPU reservation"

  - name: SLA
    description: Contractual or operational service commitment
    priority: high
    examples:
      - "99.9% availability"
      - "P1 intervention time: 15 minutes"
      - "P1 restoration time: 4 hours"
      - "RPO: 1 hour"

  - name: SLO
    description: Measured service-level objective, not necessarily contractual
    examples:
      - "P95 latency < 2s"
      - "Error rate < 1%"
      - "Metering freshness < 5 minutes"

  - name: Metric
    description: Monitoring metric, KPI, technical, or business signal
    examples:
      - "P99 latency"
      - "GPU memory usage"
      - "HTTP 5xx rate"
      - "billing aggregation lag"

  - name: Alert
    description: Alert, alert threshold, detection, or operational notification
    examples:
      - "Backend-down alert"
      - "Quota-near-limit alert"
      - "PCIe generation downgrade alert"

  # Operations
  - name: Incident
    description: Operational incident, degradation, outage, or observed anomaly
    priority: high
    examples:
      - "Proxy name-mismatch incident"
      - "RERANK billing incident"
      - "DB failover incident"
      - "Agent timeout incident"

  - name: Problem
    description: Root problem, technical debt, recurring cause, or root-cause analysis
    examples:
      - "generate_instance_yaml.py technical debt"
      - "Race condition aggregation billing"
      - "Missing backend health check"

  - name: ChangeRequest
    description: Change, RFC, production rollout, remediation, or approved evolution
    priority: high
    examples:
      - "RFC-0083 unified bare-metal deployment"
      - "RFC proxy hardening"
      - "Migration PostgreSQL HA"

  - name: OperationalDecision
    description: Architecture, operations, or security decision
    priority: high
    examples:
      - "Use a local build before rsync"
      - "Deprecate the old vLLM collector"
      - "Store the token in a vault"

  - name: Runbook
    description: Operations, diagnostic, remediation, or rollback procedure
    examples:
      - "Mac proxy diagnostic runbook"
      - "Runbook failover DB"
      - "Deployment rollback runbook"

  - name: Validation
    description: Test, evidence, verification, acceptance test, or validation result
    priority: high
    examples:
      - "curl /health OK"
      - "pytest 27/27"
      - "diff --check OK"
      - "Validated billing recomputation"

  - name: MaintenanceWindow
    description: Maintenance window, change window, or intervention period
    examples:
      - "Sunday 22:00 maintenance"
      - "Out-of-hours window"
      - "ia17 RMA intervention"

  # Security, compliance, and documentation
  - name: SecurityControl
    description: Security control, authentication, authorization, encryption, or safeguard
    priority: high
    examples:
      - "Bearer token"
      - "mTLS"
      - "RBAC"
      - "Secret vault"
      - "WAF"

  - name: ComplianceRequirement
    description: Requirement or compliance framework applicable to the service
    examples:
      - "SecNumCloud"
      - "GDPR"
      - "HDS"
      - "NIS2"
      - "DORA"

  - name: Risk
    description: Operational, security, availability, billing, or compliance risk
    examples:
      - "Double-billing risk"
      - "Secret-leak risk"
      - "GPU-saturation risk"
      - "Incomplete rollback risk"

  - name: Role
    description: Human role, IAM role, team, or operational responsibility
    examples:
      - "Operations team"
      - "Service Owner"
      - "Tenant admin"
      - "Maintainer"
      - "Reader"

  - name: Documentation
    description: Canonical document, RFC, incident report, README, ADR, specification, or documentation page
    priority: high
    examples:
      - "RFC-0089-Memory-Bank-Update.md"
      - "INC-20260603-MAC-PROXY-NAME-MISMATCH.md"
      - "scripts/README.md"
      - "Service metering ADR"

relation_types:
  - name: PROVIDES
    description: Provides a service, offering, or capability
    examples:
      - "Cloud Provider -> PROVIDES -> Managed Kubernetes"
      - "CloudService -> PROVIDES -> Chat completions"

  - name: EXPOSES
    description: Exposes an endpoint, console, or interface
    examples:
      - "CloudService -> EXPOSES -> POST /v1/chat/completions"
      - "Control plane -> EXPOSES -> Admin console"

  - name: CONSUMES
    description: Consumes a service, API, resource, or quota
    examples:
      - "Client -> CONSUMES -> CloudService"
      - "Workload -> CONSUMES -> GPU memory"

  - name: PRODUCES
    description: Produces data, a metric, deliverable, or artifact
    examples:
      - "Billing worker -> PRODUCES -> UsageRecord"
      - "Runbook -> PRODUCES -> Validation"

  - name: SUPPORTS
    description: Supports a protocol, capability, mode, or managed resource
    examples:
      - "CloudService -> SUPPORTS -> Tool calling"
      - "RuntimeEngine -> SUPPORTS -> AI model"

  - name: IMPLEMENTS
    description: Implements a capability, decision, rule, or control
    examples:
      - "Proxy -> IMPLEMENTS -> Backend healthcheck"
      - "AutomationTool -> IMPLEMENTS -> Deployment runbook"

  - name: PART_OF
    description: Is part of a set, service, environment, or architecture
    examples:
      - "RuntimeEngine -> PART_OF -> CloudService"
      - "APIEndpoint -> PART_OF -> Service API"

  - name: DEPENDS_ON
    description: Depends on a component, service, resource, or prerequisite
    examples:
      - "DBaaS -> DEPENDS_ON -> Block Storage"
      - "Agent-as-a-Service -> DEPENDS_ON -> LLMaaS"

  - name: RUNS_ON
    description: Runs on infrastructure or a compute resource
    examples:
      - "vLLM workload -> RUNS_ON -> ai-server-rtx6000-12"
      - "PostgreSQL primary -> RUNS_ON -> db-primary-01"

  - name: DEPLOYED_ON
    description: Is deployed in an environment, region, or infrastructure
    examples:
      - "CloudService -> DEPLOYED_ON -> production"
      - "Workload -> DEPLOYED_ON -> FR1"

  - name: ROUTES_TO
    description: Routes or forwards traffic to a component
    examples:
      - "Load Balancer -> ROUTES_TO -> Reverse proxy"
      - "Proxy -> ROUTES_TO -> Runtime backend"

  - name: STORES_IN
    description: Stores data in a datastore or storage resource
    examples:
      - "UsageRecord -> STORES_IN -> S3 billing bucket"
      - "Vector embedding -> STORES_IN -> Qdrant collection"

  - name: CONFIGURED_BY
    description: Is configured by a file, parameter, or configuration item
    examples:
      - "RuntimeEngine -> CONFIGURED_BY -> instance.yaml"
      - "CloudService -> CONFIGURED_BY -> pricing.yaml"

  - name: MANAGED_BY
    description: Is managed, administered, or orchestrated by a component, role, or tool
    examples:
      - "CloudService -> MANAGED_BY -> Control plane"
      - "Workload -> MANAGED_BY -> systemd"

  - name: AUTOMATED_BY
    description: Is automated by a script, pipeline, or tool
    examples:
      - "Deployment -> AUTOMATED_BY -> deploy_bm.py"
      - "Diagnostic -> AUTOMATED_BY -> diagnose_mac_proxy_remote.py"

  - name: OWNED_BY
    description: Has an owner, accountable person, or owning team
    examples:
      - "CloudService -> OWNED_BY -> Service Owner"
      - "Runbook -> OWNED_BY -> Operations team"

  - name: OPERATED_BY
    description: Is operated by a team, role, or provider
    examples:
      - "CloudService -> OPERATED_BY -> Operations team"
      - "Incident -> OPERATED_BY -> Level-2 on-call"

  - name: AUTHENTICATED_BY
    description: Uses an authentication mechanism
    examples:
      - "APIEndpoint -> AUTHENTICATED_BY -> Bearer token"
      - "Console -> AUTHENTICATED_BY -> SSO"

  - name: PROTECTED_BY
    description: Is protected by a security control
    examples:
      - "APIEndpoint -> PROTECTED_BY -> WAF"
      - "Secret -> PROTECTED_BY -> Vault"

  - name: COMPLIANT_WITH
    description: Complies with or is subject to a compliance requirement
    examples:
      - "CloudService -> COMPLIANT_WITH -> SecNumCloud"
      - "Runbook -> COMPLIANT_WITH -> Secrets policy"

  - name: HAS_SLA
    description: Has an SLA commitment
    examples:
      - "CloudService -> HAS_SLA -> 99.9% availability"
      - "Incident P1 -> HAS_SLA -> P1 intervention time: 15 minutes"

  - name: HAS_SLO
    description: Has a measured SLO
    examples:
      - "APIEndpoint -> HAS_SLO -> P95 latency < 2s"
      - "Billing pipeline -> HAS_SLO -> Freshness < 5 minutes"

  - name: MEASURED_BY
    description: Is measured by a metric, meter, or KPI
    examples:
      - "CloudService -> MEASURED_BY -> HTTP 5xx rate"
      - "CloudService -> MEASURED_BY -> BillingMeter"

  - name: MONITORED_BY
    description: Is monitored by an alert, metric, or monitoring tool
    examples:
      - "RuntimeEngine -> MONITORED_BY -> GPU memory usage"
      - "DBaaS -> MONITORED_BY -> replication lag alert"

  - name: ALERTS_ON
    description: Alerts on a risk, metric, or state
    examples:
      - "Backend-down alert -> ALERTS_ON -> Runtime backend"
      - "Quota alert -> ALERTS_ON -> QuotaPolicy"

  - name: PRICED_BY
    description: Is billed or priced according to a pricing rule
    examples:
      - "ServiceCapability -> PRICED_BY -> Rerank x1M"
      - "ManagedResource -> PRICED_BY -> vCPU/month"

  - name: LIMITED_BY
    description: Is limited by a quota, rate limit, or reserved capacity
    examples:
      - "Tenant -> LIMITED_BY -> 100 RPM"
      - "APIEndpoint -> LIMITED_BY -> Token quota"

  - name: AFFECTS
    description: Affects a service, component, customer, tenant, or SLA
    examples:
      - "Incident -> AFFECTS -> CloudService"
      - "Risk -> AFFECTS -> BillingMeter"

  - name: CAUSED_BY
    description: Is caused by a problem, change, component, or decision
    examples:
      - "Incident -> CAUSED_BY -> Configuration mismatch"
      - "Incident -> CAUSED_BY -> Race condition"

  - name: MITIGATED_BY
    description: Is mitigated by a decision, runbook, control, or change
    examples:
      - "Risk -> MITIGATED_BY -> SecurityControl"
      - "Incident -> MITIGATED_BY -> Rollback runbook"

  - name: RESOLVED_BY
    description: Is resolved by an action, validation, decision, or change
    examples:
      - "Incident -> RESOLVED_BY -> ChangeRequest"
      - "Problem -> RESOLVED_BY -> OperationalDecision"

  - name: CHANGED_BY
    description: Is modified by a change, RFC, or intervention
    examples:
      - "ConfigurationItem -> CHANGED_BY -> Deployment RFC"
      - "ServiceComponent -> CHANGED_BY -> Hotfix proxy"

  - name: VALIDATED_BY
    description: Is validated by a test, acceptance test, evidence, or control
    examples:
      - "ChangeRequest -> VALIDATED_BY -> pytest 27/27"
      - "Runbook -> VALIDATED_BY -> curl /health OK"

  - name: DOCUMENTED_IN
    description: Is documented in a canonical document
    examples:
      - "Incident -> DOCUMENTED_IN -> INC-20260603"
      - "OperationalDecision -> DOCUMENTED_IN -> RFC-0089"

  - name: ESCALATES_TO
    description: Escalates to a role, support level, or team
    examples:
      - "Incident P1 -> ESCALATES_TO -> Level-2 on-call"
      - "Alert -> ESCALATES_TO -> Service Owner"

  - name: SCHEDULED_DURING
    description: Is scheduled during a maintenance window or period
    examples:
      - "ChangeRequest -> SCHEDULED_DURING -> Out-of-hours maintenance"
      - "RMA -> SCHEDULED_DURING -> Data center maintenance window"

  - name: REQUIRES_APPROVAL
    description: Requires human approval, decision, or validation
    examples:
      - "ChangeRequest -> REQUIRES_APPROVAL -> Service Owner"
      - "Risk acceptance -> REQUIRES_APPROVAL -> RSSI"

  - name: REPLACES
    description: Replaces, deprecates, or supersedes a decision, configuration, or component
    examples:
      - "New collector -> REPLACES -> Old collector"
      - "RFC-0088 -> REPLACES -> Manual proxy procedure"

extraction_rules:
  max_entities: 100
  max_relations: 140
  include_metrics: true
  include_durations: true
  include_amounts: true
  extract_implicit_relations: true

  priority_entities:
    - CloudService
    - APIEndpoint
    - ServiceComponent
    - RuntimeEngine
    - InfrastructureNode
    - BillingMeter
    - PricingRule
    - SLA
    - Incident
    - ChangeRequest
    - OperationalDecision
    - Validation
    - SecurityControl
    - Documentation

  special_instructions: |
    # --- EXTRACTION OBJECTIVE ---
    - Build a graph that is useful for operating a managed cloud service.
    - Favor actionable relations: AFFECTS, CAUSED_BY, MITIGATED_BY,
      RESOLVED_BY, VALIDATED_BY, DOCUMENTED_IN, CONFIGURED_BY, RUNS_ON.
    - Link facts to canonical documents when an RFC, incident report,
      README, ADR, or specification is mentioned.

    # --- CANONICAL NAMING ---
    - Entity names must be stable across documents.
    - For a service: "ServiceName (type)" if the type clarifies the domain.
      Example: "LLMaaS Cloud Temple (AI inference service)".
    - For an endpoint: retain the method and path when available.
      Example: "POST /v1/rerank".
    - For a component: add a short, stable responsibility.
      Example: "llm-proxy-rust (inference reverse proxy)".
    - For an incident/RFC: retain the official identifier.
      Example: "RFC-0088 (Mac proxy hardening)".

    # --- REQUIRED MAPPINGS ---
    - RFCs, changes, production rollouts, remediations, and deployments
      are ChangeRequest entities.
    - ADRs, architecture choices, trade-offs, and operations decisions
      are OperationalDecision entities.
    - Scripts, playbooks, CI/CD pipelines, and CLI tools are AutomationTool entities.
    - YAML/TOML/env/systemd files and configuration parameters are
      ConfigurationItem entities. Do not create File, EnvVar, or
      ConfigParameter types.
    - AI models, databases, agents, clusters, buckets, and instances created
      for a tenant are ManagedResource entities.
    - Billable usage measurements are BillingMeter entities.
    - Price units, pricing exceptions, and formulas are PricingRule entities.
    - Usage limits, reservations, and rate limits are QuotaPolicy entities.
    - Tests, acceptance tests, evidence of correct operation, and concise
      command results are Validation entities.
    - Documentation file paths are Documentation entities only when canonical
      to understanding the fact.

    # --- SECRETS AND SENSITIVE DATA ---
    - NEVER extract the value of a token, password, secret, API key,
      private key, or credential.
    - If a secret is mentioned, extract only "Secret vault" or the associated
      security control as a SecurityControl entity.
    - Never put a secret in an entity name or description.

    # --- NOISE REDUCTION ---
    - Do not extract logs line by line.
    - Do not extract every CLI flag, local variable, or command-output line.
    - Do not extract isolated numeric identifiers without an operational role.
    - Do not extract dates alone as entities; include them in the incident,
      change, or maintenance window when useful.
    - Do not create artificial hubs: a CloudService must not be related
      to every entity in the document. Link the most specific entities.

    # --- FORBIDDEN OR DISCOURAGED RELATIONS ---
    - Avoid RELATED_TO. Choose a specific relation.
    - Generic "uses" must become SUPPORTS, CONSUMES, DEPENDS_ON,
      CONFIGURED_BY, MANAGED_BY, or AUTOMATED_BY according to its meaning.
    - "fixed by" must become RESOLVED_BY.
    - "tested by" must become VALIDATED_BY.
    - "documented by" must become DOCUMENTED_IN.

examples:
  - input: |
      RFC-0088 hardens Mac proxy deployments. The incident
      INC-20260603-MAC-PROXY-NAME-MISMATCH affected the Mac proxy because
      the declared backend name did not match the name expected by
      the heartbeat. The diagnose_mac_proxy_remote.py script validates the fix
      by calling /health and verifying the active backend.
    expected_entities:
      - {name: "RFC-0088 (Mac proxy hardening)", type: "ChangeRequest"}
      - {name: "INC-20260603-MAC-PROXY-NAME-MISMATCH", type: "Incident"}
      - {name: "Mac proxy (inference reverse proxy)", type: "ServiceComponent"}
      - {name: "Backend heartbeat", type: "ServiceCapability"}
      - {name: "diagnose_mac_proxy_remote.py", type: "AutomationTool"}
      - {name: "Active backend /health verification", type: "Validation"}
    expected_relations:
      - {from: "INC-20260603-MAC-PROXY-NAME-MISMATCH", to: "Mac proxy (inference reverse proxy)", type: "AFFECTS"}
      - {from: "INC-20260603-MAC-PROXY-NAME-MISMATCH", to: "Backend heartbeat", type: "CAUSED_BY"}
      - {from: "INC-20260603-MAC-PROXY-NAME-MISMATCH", to: "RFC-0088 (Mac proxy hardening)", type: "RESOLVED_BY"}
      - {from: "RFC-0088 (Mac proxy hardening)", to: "diagnose_mac_proxy_remote.py", type: "AUTOMATED_BY"}
      - {from: "RFC-0088 (Mac proxy hardening)", to: "Active backend /health verification", type: "VALIDATED_BY"}

  - input: |
      The PostgreSQL DBaaS service exposes an administration console and a
      provisioning API. The PostgreSQL HA offering runs on two nodes,
      depends on Block Storage Premium, and has a 99.95% availability SLA.
      Usage is billed in vCPU/month and GiB/month.
    expected_entities:
      - {name: "PostgreSQL DBaaS", type: "CloudService"}
      - {name: "PostgreSQL HA", type: "ServiceOffering"}
      - {name: "DBaaS administration console", type: "APIEndpoint"}
      - {name: "DBaaS provisioning API", type: "APIEndpoint"}
      - {name: "Block Storage Premium", type: "StorageResource"}
      - {name: "99.95% availability", type: "SLA"}
      - {name: "vCPU/month", type: "BillingMeter"}
      - {name: "GiB/month", type: "BillingMeter"}
    expected_relations:
      - {from: "PostgreSQL DBaaS", to: "DBaaS administration console", type: "EXPOSES"}
      - {from: "PostgreSQL DBaaS", to: "DBaaS provisioning API", type: "EXPOSES"}
      - {from: "PostgreSQL HA", to: "Block Storage Premium", type: "DEPENDS_ON"}
      - {from: "PostgreSQL DBaaS", to: "99.95% availability", type: "HAS_SLA"}
      - {from: "PostgreSQL DBaaS", to: "vCPU/month", type: "MEASURED_BY"}
      - {from: "PostgreSQL DBaaS", to: "GiB/month", type: "MEASURED_BY"}

  - input: |
      The Agent-as-a-Service exposes an MCP tool_call endpoint and consumes an
      external LLM model. Tenants are limited to 50 concurrent executions.
      Tool secrets are stored in a vault and never in prompts.
