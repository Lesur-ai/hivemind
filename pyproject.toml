[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hivemind"
dynamic = ["version"]
requires-python = ">=3.11"
# LM2-26 fix : bornes basses remontées pour exclure les versions vulnérables
# connues. uv.lock épingle les versions exactes ; ces bornes protègent les
# builds `pip install live-memory` sans uv.lock (CVE-2026-32871 sur mcp<1.27,
# CVE-2026-52869/52870 et CVE-2026-59950 sur mcp<1.28.1).
# LM2-27 fix : httpx-sse retiré (introuvable dans le code source, surface
# d'attaque inutile depuis la migration Streamable HTTP).
dependencies = [
    "mcp[cli]>=1.28.1",       # CVE-2026-32871/52869/52870/59950 — fixé en 1.28.1
    "uvicorn>=0.32.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "click>=8.1",
    "rich>=13.0",
    "prompt-toolkit>=3.0",
    "httpx>=0.28",
    "boto3>=1.40",
    "openai>=1.50",
    "python-dotenv>=1.0",
    "cryptography>=50.0.0",   # Ed25519 ; 50.0.0 corrige CVE-2026-69247.
                              # Conserve aussi le fix GHSA-537c-gmf6-5ccf.
]

[dependency-groups]
# pyyaml (P12-3, #268) : requis uniquement pour importer les modules du runtime
# Graph Memory vendored sous test (ontology → yaml). Borné au même majeur que
# requirements.lock du service embarqué (PyYAML 6.0.3).
# tenacity (P12-3) retiré (P13-1C, #276) : sa seule justification était
# l'import des modules extractor/embedder du runtime vendored, qui consomment
# désormais le retry borné des adapters hivemind_inference (ADR-0027) — plus
# aucun module importé sous test ne référence tenacity.
# qdrant-client (#277) épingle la même version que le runtime Graph Memory
# embarqué afin que les tests d'intégration exercent les métadonnées de
# collection introduites par Qdrant 1.16.
# Dev-only : l'export pip-audit (--no-dev) et les dépendances runtime Hivemind
# sont inchangés.
dev = [
    "coverage>=7.15.2",
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
    "pyyaml>=6.0,<7",
    "qdrant-client==1.18.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Restreint le collect pytest au répertoire officiel `tests/`.
# Les scripts utilitaires (`scripts/test_*.py`, `chantier/test_*.py`)
# sont des outils E2E manuels ou des reliques historiques — ils
# ne doivent pas faire échouer la CI.
testpaths = ["tests"]
markers = [
    "unit: fast isolated behavior with no dedicated runtime dependency",
    "integration: cross-component, runtime, Docker, or subprocess integration",
    "contract: documentation, policy, public-surface, and release contracts",
    "security_protocol: Hivemind protocol, authorization, recovery, and fail-closed safety",
    "e2e: collected end-to-end scenarios; Playwright remains a dedicated runner",
    # Exploration étendue opt-in du property test Hivemind (issue #11).
    # Exclue du run CI nominal ; activer avec `-m slow` + HIVEMIND_PROPERTY_SLOW=1.
    "slow: exhaustive/opt-in checks excluded from the default test run",
    "optional: explicit external binary or service proof that may skip locally",
]
