<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" fill="none" role="img" aria-label="Hivemind">
  <title>Hivemind — Lattice mark (dark surface)</title>
  <!-- Lattice v0.2. Joins: 2u hairline at 28% paper on dark. Source: Hivemind Brand Book. -->
  <line x1="23" y1="24" x2="23" y2="72" stroke="#F7F8F5" stroke-width="2" opacity="0.26"/>
  <line x1="73" y1="24" x2="73" y2="72" stroke="#F7F8F5" stroke-width="2" opacity="0.26"/>
  <line x1="23" y1="48" x2="73" y2="48" stroke="#F7F8F5" stroke-width="2" opacity="0.26"/>
  <!-- mid · consensus halo (13u, 18%) -->
  <circle cx="48" cy="48" r="13" fill="#F59E0B" opacity="0.18"/>
  <!-- short · top row -->
  <circle cx="23" cy="24" r="6" fill="#00A7C7"/>
  <circle cx="73" cy="24" r="6" fill="#00A7C7"/>
  <!-- mid · centre row (centre consensus node is always amber) -->
  <circle cx="23" cy="48" r="6" fill="#F59E0B"/>
  <circle cx="73" cy="48" r="6" fill="#F59E0B"/>
  <circle cx="48" cy="48" r="8" fill="#F59E0B"/>
  <!-- long · base row -->
  <circle cx="23" cy="72" r="6" fill="#F7F8F5"/>
  <circle cx="73" cy="72" r="6" fill="#F7F8F5"/>
</svg>
