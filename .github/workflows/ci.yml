name: Public CI

on:
  pull_request:
  push:
    branches:
      - main

# This workflow is safe for fork pull requests: it neither requests package
# permissions nor references repository, organization, or environment secrets.
permissions:
  contents: read

jobs:
  test:
    name: Test public tree
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up Node.js for browser-harness tests
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run public test suite
        run: uv run pytest tests/ -q

      - name: Check public documentation links
        run: uv run python scripts/check_doc_links.py

  test_python314_arm64:
    name: Test public tree (Python 3.14.6, arm64)
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.14.6
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.6"

      - name: Set up Node.js for browser-harness tests
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.14.6"

      - name: Install locked dependencies
        run: uv sync --locked --dev --python 3.14.6

      - name: Verify native CPython 3.14.6 runtime
        run: |
          set -euo pipefail
          uv run --no-sync python - <<'PY'
          import platform
          import sys

          expected = (3, 14, 6)
          if sys.implementation.name != "cpython" or sys.version_info[:3] != expected:
              raise SystemExit(
                  f"expected CPython {expected!r}, got "
                  f"{sys.implementation.name} {sys.version_info[:3]!r}"
              )
          if platform.machine().lower() not in {"aarch64", "arm64"}:
              raise SystemExit(f"expected native arm64 runner, got {platform.machine()!r}")
          PY

      - name: Run complete public Python test suite
        run: uv run --no-sync pytest tests/ -q

      - name: Check public documentation links
        run: uv run --no-sync python scripts/check_doc_links.py

  build:
    name: Build ${{ matrix.name }} image
    needs: [test, test_python314_arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Hivemind
            context: .
          - name: WAF
            context: waf
          - name: Graph Memory
            context: services/graph-memory
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          push: false
