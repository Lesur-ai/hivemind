name: Public CI

on:
  pull_request:
  push:
    branches:
      - main

# Fork-safe, read-only PR/main checks. Every worker has a twenty-eight-minute test
# budget; complete collection and raw evidence are verified before a stable
# check name can succeed. No image/package publication or secrets are used.
permissions:
  contents: read

jobs:
  prepare_python314:
    name: Collect public python314 suite (${{ matrix.architecture }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.14.8"
      - name: Install locked development dependencies
        run: uv sync --locked --dev --python 3.14.8
      - name: Verify interpreter and native architecture
        run: |
          set -euo pipefail
          uv run --no-sync python - <<'PY_RUNTIME'
          import platform
          import sys
          expected = (3, 14, 8)
          if sys.implementation.name != "cpython" or tuple(sys.version_info[:len(expected)]) != expected:
              raise SystemExit(f"expected CPython {expected!r}, got {sys.version_info[:3]!r}")
          machines = {'x64': {'x86_64', 'amd64'}}
          if platform.machine().lower() not in machines['${{ matrix.architecture }}']:
              raise SystemExit(f"expected native ${{ matrix.architecture }} runner, got {platform.machine()!r}")
          PY_RUNTIME
      - name: Collect all public cases into eight disjoint shards
        run: >-
          uv run --no-sync python scripts/ci_pytest_shards.py plan
          --source-sha "$GITHUB_SHA" --mode plain --shards 8
          --output .artifacts/plan.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plan-python314-${{ matrix.architecture }}
          path: .artifacts/plan.json
          if-no-files-found: error
          retention-days: 7

  python314_shards:
    name: Public python314 ${{ matrix.architecture }} shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [prepare_python314]
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64]
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.14.8"
      - name: Install locked development dependencies
        run: uv sync --locked --dev --python 3.14.8
      - name: Verify interpreter and native architecture
        run: |
          set -euo pipefail
          uv run --no-sync python - <<'PY_RUNTIME'
          import platform
          import sys
          expected = (3, 14, 8)
          if sys.implementation.name != "cpython" or tuple(sys.version_info[:len(expected)]) != expected:
              raise SystemExit(f"expected CPython {expected!r}, got {sys.version_info[:3]!r}")
          machines = {'x64': {'x86_64', 'amd64'}}
          if platform.machine().lower() not in machines['${{ matrix.architecture }}']:
              raise SystemExit(f"expected native ${{ matrix.architecture }} runner, got {platform.machine()!r}")
          PY_RUNTIME
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: plan-python314-${{ matrix.architecture }}
          path: .artifacts/plan
      - name: Run the assigned complete public shard
        run: >-
          uv run --no-sync python scripts/ci_pytest_shards.py run
          --plan .artifacts/plan/plan.json --index ${{ matrix.shard }}
          --output .artifacts/result
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: result-python314-${{ matrix.architecture }}-${{ matrix.shard }}
          path: .artifacts/result
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  test:
    name: Test public tree
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [prepare_python314, python314_shards, public_cli]
    if: ${{ always() }}
    steps:
      - name: Require preparation and every worker to succeed
        env:
          PREPARE_RESULT: ${{ needs.prepare_python314.result }}
          WORKERS_RESULT: ${{ needs.python314_shards.result }}
          CLI_RESULT: ${{ needs.public_cli.result }}
        run: test "$PREPARE_RESULT" = success && test "$WORKERS_RESULT" = success && test "$CLI_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.14.8"
      - name: Install locked development dependencies
        run: uv sync --locked --dev --python 3.14.8
      - name: Verify interpreter and native architecture
        run: |
          set -euo pipefail
          uv run --no-sync python - <<'PY_RUNTIME'
          import platform
          import sys
          expected = (3, 14, 8)
          if sys.implementation.name != "cpython" or tuple(sys.version_info[:len(expected)]) != expected:
              raise SystemExit(f"expected CPython {expected!r}, got {sys.version_info[:3]!r}")
          if platform.machine().lower() not in {'x86_64', 'amd64'}:
              raise SystemExit(f"expected native x64 runner, got {platform.machine()!r}")
          PY_RUNTIME
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: plan-python314-x64
          path: .artifacts/plans/x64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: result-python314-x64-*
          path: .artifacts/results/x64
      - name: Verify complete source-bound public evidence on X64
        run: |
          set -euo pipefail
          for architecture in x64; do
            uv run --no-sync python -c 'import sys; from pathlib import Path; from scripts.ci_pytest_shards import read_json, require; require(read_json(Path(sys.argv[1]))["runtime"]["machine"] == sys.argv[2], "wrong hardware cohort")' ".artifacts/plans/$architecture/plan.json" "$architecture"
            uv run --no-sync python scripts/ci_pytest_shards.py verify \
              --plan ".artifacts/plans/$architecture/plan.json" \
              --results ".artifacts/results/$architecture" \
              --source-sha "$GITHUB_SHA" --output ".artifacts/verified/$architecture"
          done
      - name: Check public documentation links
        run: uv run --no-sync python scripts/check_doc_links.py

  # Historical required context: the label is stable, but this verifies X64 only.
  # Native ARM64 evidence is produced separately at final release assembly.
  test_python314_arm64:
    name: Test public tree (Python 3.14.8, arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test]
    if: ${{ always() }}
    steps:
      - name: Require the single supported Python suite
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$TEST_RESULT" = success

  public_cli:
    name: Public ingestion CLI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go for the public ingestion CLI
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/hivemind-ingest/go.mod
          cache-dependency-path: tools/hivemind-ingest/go.sum

      - name: Build and test the public ingestion CLI
        run: |
          set -euo pipefail
          bash scripts/build-hivemind-ingest.sh --test
          test "$(./bin/hivemind-ingest version | awk '{print $2}')" = \
            "v$(tr -d '\r\n' < VERSION)"
