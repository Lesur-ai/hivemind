name: Public CI

on:
  pull_request:
  push:
    branches:
      - main

# This workflow is safe for fork pull requests: it neither requests package
# permissions nor references repository, organization, or environment secrets.
permissions:
  contents: read

jobs:
  test:
    name: Test public tree
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up Node.js for browser-harness tests
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run public test suite
        run: uv run --no-sync pytest tests/ -q --strict-markers --durations=50

      - name: Check public documentation links
        run: uv run python scripts/check_doc_links.py

  test_python314_arm64:
    name: Test public tree (Python 3.14.6, arm64)
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.14.6
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.6"

      - name: Set up Node.js for browser-harness tests
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14.6"

      - name: Install locked dependencies
        run: uv sync --locked --dev --python 3.14.6

      - name: Verify native CPython 3.14.6 runtime
        run: |
          set -euo pipefail
          uv run --no-sync python - <<'PY'
          import platform
          import sys

          expected = (3, 14, 6)
          if sys.implementation.name != "cpython" or sys.version_info[:3] != expected:
              raise SystemExit(
                  f"expected CPython {expected!r}, got "
                  f"{sys.implementation.name} {sys.version_info[:3]!r}"
              )
          if platform.machine().lower() not in {"aarch64", "arm64"}:
              raise SystemExit(f"expected native arm64 runner, got {platform.machine()!r}")
          PY

      - name: Run complete public Python test suite
        run: uv run --no-sync pytest tests/ -q --strict-markers --durations=50

      - name: Check public documentation links
        run: uv run --no-sync python scripts/check_doc_links.py

# TQ-11 (#349): this workflow used to end with a `build` job (matrix: Hivemind,
# WAF, Graph Memory) that built every shipped image without publishing it, on
# every pull_request and push to main. That coverage is now the exact-SHA
# pre-release-validate.yml workflow's job in the private canonical repository
# (TQ-9, #347), which builds and smokes the identical Dockerfiles (Dockerfile,
# waf/Dockerfile, services/graph-memory/Dockerfile) this staged public tree
# also ships, on every push to private main, before any release candidate can
# publish. Unlike the private build.yml `build` job, this one carries no
# required-status-check name to preserve: the public repository this template
# is staged into does not exist yet (ADR-0023), so there is no live ruleset
# depending on a "Build ... image" context here. The final release-time build
# remains release.yml's tag-triggered publish job.
