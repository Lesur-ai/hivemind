name: Feature request
description: Propose a focused improvement to the public Hivemind product
title: "[Feature]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, private data, or undisclosed vulnerability details.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the user problem and who is affected.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Explain the smallest behavior or interface change that would help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe workarounds or other approaches you evaluated.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Reproducible evidence or tests
      description: Include a minimal example, expected result, or proposed test that would demonstrate the need.
    validations:
      required: true
